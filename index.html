<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMORA Invoice Generator (PI / TI)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --brand1:#4f46e5; --brand2:#7c3aed; }
        body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#f4f5fb; min-height:100vh; color:#1f2937; }
        .btn-primary { background:linear-gradient(to right,var(--brand1),var(--brand2)); color:#fff; padding:12px 24px; border-radius:8px; font-weight:600; border:none; cursor:pointer; transition:.2s; }
        .btn-primary:hover { filter:brightness(1.07); box-shadow:0 8px 18px rgba(79,70,229,.25); }
        .btn-primary:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
        .btn-secondary { background:#e5e7eb; color:#374151; padding:10px 18px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
        .btn-secondary:hover { background:#d1d5db; }
        .input-field { width:100%; padding:11px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:15px; box-sizing:border-box; }
        .input-field:focus { outline:none; border-color:var(--brand1); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
        .card { background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(17,24,39,.06); border:1px solid #eef0f6; }
        .progress-step { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:14px; }
        .progress-step.active { background:linear-gradient(to right,var(--brand1),var(--brand2)); }
        .progress-step.completed { background:#10b981; }
        .progress-step.inactive { background:#c4c8d4; }
        .stock-high { background:#dcfce7; color:#166534; border:1.5px solid #bbf7d0; }
        .stock-medium { background:#fef3c7; color:#92400e; border:1.5px solid #fde68a; }
        .stock-low { background:#fecaca; color:#991b1b; border:1.5px solid #fca5a5; }
        .stock-unknown { background:#f3f4f6; color:#6b7280; border:1.5px solid #e5e7eb; }
        .doc-toggle { display:inline-flex; background:#eef0f6; border-radius:10px; padding:4px; gap:4px; }
        .doc-toggle button { border:none; background:transparent; padding:8px 18px; border-radius:8px; font-weight:700; cursor:pointer; color:#4b5563; }
        .doc-toggle button.on { background:linear-gradient(to right,var(--brand1),var(--brand2)); color:#fff; }
        .lightbox-overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); display:flex; align-items:center; justify-content:center; z-index:9999; opacity:0; visibility:hidden; transition:.25s; }
        .lightbox-overlay.visible { opacity:1; visibility:visible; }
        .lightbox-content { max-width:90%; max-height:90%; position:relative; }
        .lightbox-image { display:block; max-width:100vw; max-height:90vh; border-radius:12px; box-shadow:0 0 30px rgba(0,0,0,.5); }
        .lightbox-close { position:absolute; top:8px; right:8px; background:#fff; color:var(--brand1); border:none; border-radius:50%; width:40px; height:40px; font-size:22px; cursor:pointer; font-weight:bold; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
            <div style="text-align:center;">
                <div style="font-size:22px;margin-bottom:20px;">Loading UMORA Invoice Generator…</div>
                <div style="width:44px;height:44px;border:5px solid #eee;border-top:5px solid var(--brand1);border-radius:50%;margin:0 auto;animation:spin 1s linear infinite;"></div>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ---- Number to words (Indian system) ----
        const numberToWordsIndianSystem = (n) => {
            const num = Math.floor(n);
            const words = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
            const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
            if (num === 0) return 'INR Zero Only';
            const c = (x) => { if(x===0)return''; if(x<20)return words[x]; if(x<100)return tens[Math.floor(x/10)]+(x%10?' '+words[x%10]:''); return words[Math.floor(x/100)]+' Hundred'+(x%100?' '+c(x%100):''); };
            let t = num, r='';
            const groups=[[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand'],[100,'Hundred']];
            for (const [d,u] of groups){ if(t>=d){ r+=c(Math.floor(t/d))+' '+u+' '; t%=d; } }
            if(t>0) r+=c(t);
            const paise = Math.round((n-num)*100);
            let p=''; if(paise>0) p=' and '+c(paise)+' Paise';
            return ('INR '+r.trim().replace(/\s+/g,' ')+p+' Only');
        };

        const DOC_LABELS = { PI: 'PROFORMA INVOICE', TI: 'TAX INVOICE' };

        function App() {
            const [mode, setMode] = useState('start');          // 'start' | 'flow'
            const [docType, setDocType] = useState('PI');        // 'PI' | 'TI'
            const [editMode, setEditMode] = useState(false);
            const [currentStep, setCurrentStep] = useState(1);

            const [customerData, setCustomerData] = useState({
                date: new Date().toISOString().split('T')[0],
                customerName:'', customerMobile:'', city:'', pincode:''
            });
            const [invoiceData, setInvoiceData] = useState({
                customerName:'', addressLine1:'', addressLine2:'', city:'', pincode:'', state:'', gstNo:'',
                contactPerson:'', contactDetails:'', totalCartons:'', ewayBillNumber:'',
                paymentTerms:'100% ADVANCE', customPaymentTerms:'', logisticsCharges:0, cashDiscount:0,
                piNumber:'13/2025-26'
            });

            const [products, setProducts] = useState([]);
            const [categories, setCategories] = useState([]);
            const [currentCategory, setCurrentCategory] = useState(0);
            const [uploadedCSV, setUploadedCSV] = useState(null);
            const [orderData, setOrderData] = useState({});
            const [orderSummary, setOrderSummary] = useState({ totalItems:0, totalValue:0 });

            const [inventoryData, setInventoryData] = useState({});
            const [uploadedInventoryFiles, setUploadedInventoryFiles] = useState([]);
            const [inventoryStats, setInventoryStats] = useState({ totalSKUs:0, matchedSKUs:0, unknownSKUs:0 });
            const [showDownloadOptions, setShowDownloadOptions] = useState(false);
            const [notice, setNotice] = useState('');
            const [lightbox, setLightbox] = useState({ visible:false, imageUrl:'' });

            const fileInputRef = useRef(null);
            const inventoryFileInputRef = useRef(null);
            const editInputRef = useRef(null);

            const flash = (msg) => { setNotice(msg); setTimeout(()=>setNotice(''), 4000); };
            const openLightbox = (u) => setLightbox({ visible:true, imageUrl:u });
            const closeLightbox = () => setLightbox({ visible:false, imageUrl:'' });

            // ---- Totals ----
            useEffect(() => {
                let totalItems=0, totalValue=0;
                Object.keys(orderData).forEach(sku => {
                    const q = orderData[sku];
                    if (q>0){ const p=products.find(x=>x['Child SKU Code']===sku); if(p){ totalItems+=q; totalValue+=q*parseFloat(p.WSP||0); } }
                });
                setOrderSummary({ totalItems, totalValue: totalValue.toFixed(2) });
            }, [orderData, products]);

            // ---- Inventory stats ----
            useEffect(() => {
                if (products.length>0){
                    const uniq=[...new Set(products.map(p=>p['Child SKU Code']))].filter(Boolean);
                    const matched=uniq.filter(s=>inventoryData[s.toUpperCase()]!==undefined);
                    setInventoryStats({ totalSKUs:uniq.length, matchedSKUs:matched.length, unknownSKUs:uniq.length-matched.length });
                }
            }, [products, inventoryData]);

            // ---- Catalog upload ----
            const handleCSVUpload = (event) => {
                const file = event.target.files[0]; if(!file) return;
                Papa.parse(file, { header:true, dynamicTyping:true, skipEmptyLines:true,
                    complete: (res) => {
                        const cleaned = res.data.map(row => {
                            const cr={};
                            Object.keys(row).forEach(k => {
                                let ck=k.replace(/[^a-zA-Z0-9\s]/g,'').trim();
                                if (k.toLowerCase().includes('image') && k.toLowerCase().includes('url')) ck='Image URL';
                                cr[ck]=row[k];
                            });
                            return cr;
                        }).filter(r=>r['Child SKU Code']);
                        setProducts(cleaned);
                        setCategories([...new Set(cleaned.map(i=>i.Category))].filter(Boolean));
                        setUploadedCSV(file.name);
                        flash('✅ Catalog loaded: '+cleaned.length+' products.');
                    },
                    error: (e) => flash('❌ Catalog error: '+e.message)
                });
                event.target.value='';
            };

            // ---- Inventory upload (MULTIPLE files clubbed) ----
            const handleInventoryUpload = (event) => {
                const files = Array.from(event.target.files); if(!files.length) return;
                let pending = files.length;
                const merged = { ...inventoryData };
                const names = [...uploadedInventoryFiles];
                files.forEach(file => {
                    Papa.parse(file, { header:true, dynamicTyping:true, skipEmptyLines:true,
                        complete: (res) => {
                            res.data.forEach(row => {
                                const cr={}; Object.keys(row).forEach(k=>cr[k.trim()]=row[k]);
                                let sku = cr.sku || cr.SKU || cr['Child SKU Code'];
                                const qty = parseInt(cr.old_quantity || cr.quantity || cr.stock || cr.Stock || 0);
                                if (sku){
                                    sku = String(sku).toUpperCase();
                                    if (sku.startsWith('SZ')) sku='LA'+sku.substring(2);
                                    merged[sku] = qty;
                                }
                            });
                            names.push(file.name);
                            if (--pending===0){
                                setInventoryData(merged);
                                setUploadedInventoryFiles(names);
                                flash('✅ Inventory clubbed from '+names.length+' file(s): '+Object.keys(merged).length+' SKUs.');
                            }
                        },
                        error: (e) => { if(--pending===0){ setInventoryData(merged); setUploadedInventoryFiles(names);} flash('❌ Inventory error: '+e.message); }
                    });
                });
                event.target.value='';
            };

            // ---- Use stock straight from catalog's Stock column ----
            const useCatalogStock = () => {
                if (!products.length){ flash('⚠️ Upload the catalog first.'); return; }
                const map={};
                products.forEach(p => {
                    const sku=p['Child SKU Code']; const st=p.Stock;
                    if (sku && st!==undefined && st!=='' && st!==null) map[String(sku).toUpperCase()]=parseInt(st)||0;
                });
                if (!Object.keys(map).length){ flash('⚠️ No "Stock" column found in catalog.'); return; }
                setInventoryData(map);
                setUploadedInventoryFiles(['(from catalog Stock column)']);
                flash('✅ Using stock from catalog: '+Object.keys(map).length+' SKUs.');
            };

            const getStockInfo = (sku) => {
                const s = inventoryData[String(sku).toUpperCase()];
                if (s===undefined) return { quantity:null, status:'unknown', className:'stock-unknown' };
                if (s>=50) return { quantity:s, status:'high', className:'stock-high' };
                if (s>=10) return { quantity:s, status:'medium', className:'stock-medium' };
                return { quantity:s, status:'low', className:'stock-low' };
            };

            const groupProductsByParentAndVariant = (catProducts) => {
                const g={};
                catProducts.forEach(p => {
                    const parent=p['Parent SKU Code']; const child=p['Child SKU Code'];
                    let variant = (child && child.length>11) ? child.substring(9,12) : (p.Color||'DEFAULT');
                    const key=`${parent}_${variant}`;
                    if(!g[key]) g[key]={ parentSKU:parent, variant, color:p.Color, category:p.Category, mrp:p.MRP, imageUrl:p['Image URL']?String(p['Image URL']).trim():'', hsn:p.HSN, sizes:[] };
                    g[key].sizes.push({ size:p.Size, childSKU:child, wsp:p.WSP });
                });
                return Object.values(g);
            };

            const handleQuantityChange = (sku, quantity) => {
                const info=getStockInfo(sku);
                const qty = quantity===''?0:(parseInt(quantity)||0);
                if (info.quantity!==null && qty>info.quantity){ flash(`❌ Only ${info.quantity} in stock for ${sku}.`); return; }
                setOrderData(prev => { const n={...prev}; if(qty<=0) delete n[sku]; else n[sku]=qty; return n; });
            };

            const getCurrentCategoryProducts = () => categories.length? products.filter(p=>p.Category===categories[currentCategory]) : [];

            const validateCustomerInfo = () => {
                const { customerName, customerMobile, city, pincode } = customerData;
                return customerName.trim() && /^\d{10}$/.test(customerMobile) && city.trim() && /^\d{6}$/.test(pincode);
            };

            const indianStates = ['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Andaman and Nicobar Islands','Chandigarh','Dadra and Nagar Haveli and Daman and Diu','Delhi','Jammu and Kashmir','Ladakh','Lakshadweep','Puducherry'];

            const proceedToInvoice = () => {
                setInvoiceData(prev => ({ ...prev, customerName:customerData.customerName, city:customerData.city, pincode:customerData.pincode, contactDetails:customerData.customerMobile }));
                setCurrentStep(5);
            };

            const calculateInvoiceTotals = () => {
                const entries = Object.keys(orderData).filter(s=>orderData[s]>0);
                let totalQty=0, totalValue=0;
                entries.forEach(s => { const q=orderData[s]; const p=products.find(x=>x['Child SKU Code']===s); if(p){ totalQty+=q; totalValue+=q*parseFloat(p.WSP||0);} });
                const discountAmount=(totalValue*invoiceData.cashDiscount)/100;
                const netAmount=totalValue-discountAmount+parseFloat(invoiceData.logisticsCharges||0);
                const isMaharashtra=invoiceData.state.toLowerCase().includes('maharashtra');
                const gstAmount=(netAmount*5)/100;
                const finalAmount=netAmount+gstAmount;
                return { totalQty, totalValue, discountAmount, netAmount, gstAmount, finalAmount, isMaharashtra,
                    cgst:isMaharashtra?gstAmount/2:0, sgst:isMaharashtra?gstAmount/2:0, igst:!isMaharashtra?gstAmount:0 };
            };

            const getOrderProductsWithIndex = () => Object.keys(orderData)
                .filter(s=>orderData[s]>0)
                .map(s => ({ childSKU:s, quantity:orderData[s], product:products.find(p=>p['Child SKU Code']===s) }))
                .filter(i=>i.product)
                .sort((a,b)=>String(a.product['Parent SKU Code']).localeCompare(String(b.product['Parent SKU Code'])));

            // ---- Load an existing invoice (edit) ----
            const loadExistingInvoice = (event) => {
                const file = event.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const text = e.target.result;
                        const m = text.match(/<script id="umora-pi-data" type="application\/json">([\s\S]*?)<\/script>/);
                        if (!m) { flash('❌ This file has no editable UMORA invoice data. Only invoices generated by this new tool can be re-edited.'); event.target.value=''; return; }
                        const data = JSON.parse(m[1]);
                        setDocType(data.docType || 'PI');
                        setCustomerData(prev => ({ ...prev, ...(data.customerData||{}) }));
                        setInvoiceData(prev => ({ ...prev, ...(data.invoiceData||{}) }));
                        const items = data.lineItems || [];
                        const prods = items.map(it => it.product);
                        setProducts(prods);
                        setCategories([...new Set(prods.map(p=>p.Category))].filter(Boolean));
                        const od={}; items.forEach(it => { od[it.product['Child SKU Code']] = it.quantity; });
                        setOrderData(od);
                        setUploadedCSV('(from existing invoice)');
                        setEditMode(true);
                        setMode('flow');
                        setCurrentStep(5);
                        flash('✏️ Loaded existing '+(DOC_LABELS[data.docType||'PI'])+' — edit and re-download.');
                    } catch (err) { flash('❌ Could not read invoice: '+err.message); }
                    event.target.value='';
                };
                reader.readAsText(file);
            };

            // ---- Build invoice HTML (with embedded editable data) ----
            const generateInvoiceHTML = () => {
                const totals = calculateInvoiceTotals();
                const orderProducts = getOrderProductsWithIndex();
                const qrCodeUrl = "https://cdn.shopify.com/s/files/1/0612/8861/1913/files/Umora_UP_QR_200_pixel_x_205_pixel.jpg?v=1759408517";
                const signatureImageUrl = "https://cdn.shopify.com/s/files/1/0612/8861/1913/files/Stamp_signature_100_x_100_pixels.png?v=1759754504";
                const totalInWords = numberToWordsIndianSystem(totals.finalAmount);
                const heading = DOC_LABELS[docType];

                const embed = {
                    version: 2,
                    docType,
                    generatedAt: new Date().toISOString(),
                    customerData,
                    invoiceData,
                    lineItems: orderProducts.map(i => ({ quantity:i.quantity, product:i.product }))
                };
                const embedJson = JSON.stringify(embed).replace(/<\/script>/gi,'<\\/script>');

                return `<!DOCTYPE html>
<html>
<head>
<title>${heading} ${invoiceData.piNumber}</title>
<script id="umora-pi-data" type="application/json">${embedJson}<\/script>
<style>
 body{font-family:Arial,sans-serif;margin:20px;font-size:11px;}
 .header{text-align:center;border-bottom:2px solid #000;padding:20px;}
 .company-name{font-size:28px;font-weight:bold;}
 .invoice-details{display:flex;justify-content:space-between;margin:20px 0;}
 .customer-details,.company-details{width:48%;}
 .products-table{width:100%;border-collapse:collapse;margin:20px 0;}
 .products-table th,.products-table td{border:1px solid #000;padding:8px;text-align:left;}
 .products-table th{background:#f0f0f0;}
 .totals{text-align:right;margin:20px 0;}
 .total-line{margin:5px 0;}
 .final-total{font-weight:bold;font-size:14px;border-top:2px solid #000;padding-top:10px;}
 .highlight{background:#ffffc0;padding:5px;border-radius:3px;}
 .invoice-footer-grid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:30px;width:100%;}
 .qr-terms-block{width:50%;text-align:left;padding-right:20px;}
 .signature-block{width:50%;text-align:right;}
 @media print{body{margin:10px;}}
</style>
</head>
<body>
 <div class="header">
  <div class="company-name">UMORA FASHION PRIVATE LIMITED</div>
  <div>Register Office: 25, Prabhat Centre Premises Co-op Society Ltd, Plot no 7, Sector 1A, CBD Belapur Navi Mumbai 400614</div>
  <div>Factory Address: F6/218, Bhumi World Industrial Park, Pimplas Village, Mumbai-Nashik Highway, Thane – 421302</div>
  <div style="margin-top:15px;background:#ffeb3b;padding:10px;font-weight:bold;">
   ${heading}# ${invoiceData.piNumber} &nbsp;&nbsp;&nbsp; DATE ${new Date().toLocaleDateString('en-GB')}
  </div>
  <div style="font-weight:bold;margin-top:10px;">GSTIN/UIN: 27AADCU5944M1ZR</div>
 </div>
 <div class="invoice-details">
  <div class="customer-details">
   <h3>BUYER DETAILS</h3>
   <div><strong>CUSTOMER NAME:</strong> ${invoiceData.customerName}</div>
   <div><strong>ADDRESS LINE 1:</strong> ${invoiceData.addressLine1}</div>
   <div><strong>ADDRESS LINE 2:</strong> ${invoiceData.addressLine2}</div>
   <div><strong>CITY:</strong> ${invoiceData.city}</div>
   <div><strong>PINCODE:</strong> ${invoiceData.pincode}</div>
   <div><strong>STATE:</strong> ${invoiceData.state}</div>
   <div><strong>GST NO:</strong> ${invoiceData.gstNo}</div>
   <div><strong>CONTACT PERSON:</strong> ${invoiceData.contactPerson}</div>
   <div><strong>CONTACT DETAILS:</strong> ${invoiceData.contactDetails}</div>
  </div>
  <div class="company-details">
   <h3>BANKING DETAILS</h3>
   <div><strong>UMORA FASHION PVT LTD</strong></div>
   <div>ICICI BANK VASHI</div>
   <div>IFSC Code: ICIC0001881</div>
   <div>A/c No: 188105002877</div>
   <div style="margin-top:20px;">
    <div><strong>TOTAL CARTONS:</strong> ${invoiceData.totalCartons}</div>
    <div><strong>E-WAY BILL:</strong> ${invoiceData.ewayBillNumber}</div>
    <div><strong>PAYMENT TERMS:</strong> ${invoiceData.paymentTerms==='OTHER'?invoiceData.customPaymentTerms:invoiceData.paymentTerms}</div>
    <div><strong>LOGISTICS CHARGES:</strong> ${invoiceData.logisticsCharges>0?'₹'+parseFloat(invoiceData.logisticsCharges).toFixed(2):'FREE'}</div>
   </div>
  </div>
 </div>
 <table class="products-table">
  <thead><tr><th>S NO</th><th>Product Code</th><th>Size</th><th>Category</th><th>Color</th><th>HSN</th><th>Qty</th><th>MRP</th><th>Rate</th><th>Amount</th></tr></thead>
  <tbody>
  ${orderProducts.map((item,i)=>{ const {product,quantity}=item; const lt=quantity*parseFloat(product.WSP||0);
    return `<tr><td>${i+1}</td><td>${product['Child SKU Code']}</td><td>${product.Size}</td><td>${product.Category}</td><td>${product.Color}</td><td>${product.HSN}</td><td><strong>${quantity}</strong></td><td>₹${product.MRP}</td><td><strong>₹${product.WSP}</strong></td><td><strong>₹${lt.toFixed(2)}</strong></td></tr>`;
  }).join('')}
  </tbody>
 </table>
 <div class="totals">
  <div class="total-line">Total Quantity: <strong>${totals.totalQty}</strong></div>
  <div class="total-line">Total Value: <strong>₹${totals.totalValue.toFixed(2)}</strong></div>
  ${invoiceData.cashDiscount>0?`<div class="total-line">Cash Discount (${invoiceData.cashDiscount}%): <strong>₹${totals.discountAmount.toFixed(2)}</strong></div>`:''}
  ${invoiceData.logisticsCharges>0?`<div class="total-line">Logistics Charges: <strong>₹${parseFloat(invoiceData.logisticsCharges).toFixed(2)}</strong></div>`:''}
  <div class="total-line">Net Amount: <strong>₹${totals.netAmount.toFixed(2)}</strong></div>
  ${totals.isMaharashtra?`<div class="total-line">CGST @ 2.5%: <strong>₹${totals.cgst.toFixed(2)}</strong></div><div class="total-line">SGST @ 2.5%: <strong>₹${totals.sgst.toFixed(2)}</strong></div>`:`<div class="total-line">IGST @ 5%: <strong>₹${totals.igst.toFixed(2)}</strong></div>`}
  <div class="final-total">TOTAL INVOICE VALUE: <strong>₹${totals.finalAmount.toFixed(2)}</strong></div>
 </div>
 <div style="margin-top:15px;font-size:12px;font-weight:bold;margin-bottom:30px;">
  Total Invoice Value in Words: <span class="highlight">${totalInWords}</span>
 </div>
 <div class="invoice-footer-grid">
  <div class="qr-terms-block">
   <div style="margin-bottom:20px;">
    <img src="${qrCodeUrl}" alt="QR" style="width:200px;height:205px;border:1px solid #ddd;padding:5px;display:block;">

 </div>

                                            <h3 style={{ borderBottom:'2px solid #eef0f6', paddingBottom:'8px' }}>{DOC_LABELS[docType]} Details</h3>
                                            <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
                                                <div><label style={{ fontWeight:600 }}>{docType==='TI'?'Tax Invoice':'PI'} Number *</label><input className="input-field" value={invoiceData.piNumber} onChange={e=>setInvoiceData({...invoiceData,piNumber:e.target.value})} /></div>
                                                <div><label style={{ fontWeight:600 }}>Total Cartons/Boxes</label><input className="input-field" value={invoiceData.totalCartons} onChange={e=>setInvoiceData({...invoiceData,totalCartons:e.target.value})} /></div>
                                                <div><label style={{ fontWeight:600 }}>E-way Bill Number</label><input className="input-field" value={invoiceData.ewayBillNumber} onChange={e=>setInvoiceData({...invoiceData,ewayBillNumber:e.target.value})} /></div>
                                                <div><label style={{ fontWeight:600 }}>Payment Terms</label>
                                                    <select className="input-field" value={invoiceData.paymentTerms} onChange={e=>setInvoiceData({...invoiceData,paymentTerms:e.target.value})}><option value="100% ADVANCE">100% ADVANCE</option><option value="OTHER">Other</option></select>
                                                    {invoiceData.paymentTerms==='OTHER' && <input className="input-field" style={{ marginTop:'8px' }} value={invoiceData.customPaymentTerms} onChange={e=>setInvoiceData({...invoiceData,customPaymentTerms:e.target.value})} placeholder="Custom payment terms" />}
                                                </div>
                                                <div><label style={{ fontWeight:600 }}>Logistics Charges (₹)</label><input type="number" min="0" step="0.01" className="input-field" value={invoiceData.logisticsCharges} onChange={e=>setInvoiceData({...invoiceData,logisticsCharges:parseFloat(e.target.value)||0})} /></div>
                                                <div><label style={{ fontWeight:600 }}>Cash Discount (%)</label><input type="number" min="0" max="100" step="0.1" className="input-field" value={invoiceData.cashDiscount} onChange={e=>setInvoiceData({...invoiceData,cashDiscount:parseFloat(e.target.value)||0})} /></div>
                                                <div style={{ background:'#f9fafb', padding:'18px', borderRadius:'10px', border:'1px solid #eef0f6' }}>
                                                    <h4 style={{ fontWeight:700, margin:'0 0 12px' }}>Invoice Preview</h4>
                                                    {(()=>{ const t=calculateInvoiceTotals(); return (
                                                        <div style={{ display:'flex', flexDirection:'column', gap:'6px', fontSize:'14px' }}>
                                                            <div style={{ display:'flex', justifyContent:'space-between' }}><span>Total Qty:</span><strong>{t.totalQty}</strong></div>
                                                            <div style={{ display:'flex', justifyContent:'space-between' }}><span>Total Value:</span><strong>₹{t.totalValue.toFixed(2)}</strong></div>
                                                            {invoiceData.cashDiscount>0 && <div style={{ display:'flex', justifyContent:'space-between', color:'#dc2626' }}><span>Discount ({invoiceData.cashDiscount}%):</span><strong>-₹{t.discountAmount.toFixed(2)}</strong></div>}
                                                            {invoiceData.logisticsCharges>0 && <div style={{ display:'flex', justifyContent:'space-between', color:'#2563eb' }}><span>Logistics:</span><strong>+₹{parseFloat(invoiceData.logisticsCharges).toFixed(2)}</strong></div>}
                                                            <div style={{ display:'flex', justifyContent:'space-between', borderTop:'1px solid #d1d5db', paddingTop:'6px' }}><span>Net Amount:</span><strong>₹{t.netAmount.toFixed(2)}</strong></div>
                                                            {t.isMaharashtra ? (<><div style={{ display:'flex', justifyContent:'space-between', color:'#16a34a' }}><span>CGST @ 2.5%:</span><strong>₹{t.cgst.toFixed(2)}</strong></div><div style={{ display:'flex', justifyContent:'space-between', color:'#16a34a' }}><span>SGST @ 2.5%:</span><strong>₹{t.sgst.toFixed(2)}</strong></div></>) : (<div style={{ display:'flex', justifyContent:'space-between', color:'#16a34a' }}><span>IGST @ 5%:</span><strong>₹{t.igst.toFixed(2)}</strong></div>)}
                                                            <div style={{ display:'flex', justifyContent:'space-between', borderTop:'2px solid #374151', paddingTop:'6px', fontSize:'16px', fontWeight:800 }}><span>Final:</span><span style={{ color:'#16a34a' }}>₹{t.finalAmount.toFixed(2)}</span></div>
                                                        </div>
                                                    ); })()}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div style={{ marginTop:'32px', display:'flex', justifyContent:'space-between' }}>
                                        <button className="btn-secondary" onClick={()=>setCurrentStep(4)}>← Back to Orders</button>
                                        <button className="btn-primary" onClick={()=>setShowDownloadOptions(true)} disabled={!invoiceData.customerName||!invoiceData.addressLine1||!invoiceData.city||!invoiceData.pincode||!invoiceData.state} style={{ background:(invoiceData.customerName&&invoiceData.addressLine1&&invoiceData.city&&invoiceData.pincode&&invoiceData.state)?'linear-gradient(to right,#16a34a,#15803d)':'#9ca3af' }}>📄 Download {docType}</button>
                                    </div>

                                    {showDownloadOptions && (
                                        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}>
                                            <div style={{ background:'#fff', borderRadius:'14px', padding:'34px', maxWidth:'460px', width:'90%' }}>
                                                <h3 style={{ textAlign:'center', marginTop:0 }}>📄 Download {DOC_LABELS[docType]}</h3>
                                                <div style={{ display:'flex', flexDirection:'column', gap:'12px', marginTop:'20px' }}>
                                                    <button className="btn-primary" onClick={downloadAsPDF} style={{ background:'linear-gradient(to right,#dc2626,#b91c1c)' }}>📄 Download as PDF (Print)</button>
                                                    <button className="btn-primary" onClick={downloadAsHTML} style={{ background:'linear-gradient(to right,#2563eb,#1d4ed8)' }}>🌐 Download as HTML (re-editable)</button>
                                                    <button className="btn-primary" onClick={downloadAsExcel} style={{ background:'linear-gradient(to right,#16a34a,#15803d)' }}>📊 Download as Excel</button>
                                                </div>
                                                <div style={{ marginTop:'16px', padding:'12px', background:'#eff6ff', borderRadius:'8px', fontSize:'13px', color:'#1e40af' }}>
                                                    💡 The <strong>HTML</strong> file stores all invoice data — re-upload it on the start screen to edit later.
                                                </div>
                                                <div style={{ marginTop:'16px', textAlign:'center' }}><button className="btn-secondary" onClick={()=>setShowDownloadOptions(false)}>Cancel</button></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    <div className={`lightbox-overlay ${lightbox.visible?'visible':''}`} onClick={closeLightbox}>
                        <div className="lightbox-content" onClick={e=>e.stopPropagation()}>
                            <button className="lightbox-close" onClick={closeLightbox}>×</button>
                            <img src={lightbox.imageUrl} alt="Product" className="lightbox-image" onError={e=>e.target.src='https://placehold.co/800x600/CCCCCC/333333?text=Image+Load+Error'} />
                        </div>
                    </div>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
