<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMORA Invoice Generator (PI / TI)</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script src="https://unpkg.com/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <script>
        // if unpkg is unreachable, fall back to jsDelivr for the screenshot reader
        if (!window.Tesseract) {
            document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"><\/scr' + 'ipt>');
        }
    </script>
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --brand1:#4f46e5; --brand2:#7c3aed; }
        body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#f4f5fb; min-height:100vh; color:#1f2937; }
        .btn-primary { background:linear-gradient(to right,var(--brand1),var(--brand2)); color:#fff; padding:12px 24px; border-radius:8px; font-weight:600; border:none; cursor:pointer; transition:.2s; }
        .btn-primary:hover { filter:brightness(1.07); box-shadow:0 8px 18px rgba(79,70,229,.25); }
        .btn-primary:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
        .btn-secondary { background:#e5e7eb; color:#374151; padding:10px 18px; border-radius:8px; border:none; cursor:pointer; font-weight:600; }
        .btn-secondary:hover { background:#d1d5db; }
        .input-field { width:100%; padding:11px; border:1.5px solid #e5e7eb; border-radius:8px; font-size:15px; box-sizing:border-box; }
        .input-field:focus { outline:none; border-color:var(--brand1); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
        .card { background:#fff; border-radius:14px; box-shadow:0 6px 20px rgba(17,24,39,.06); border:1px solid #eef0f6; }
        .progress-step { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:14px; }
        .progress-step.active { background:linear-gradient(to right,var(--brand1),var(--brand2)); }
        .progress-step.completed { background:#10b981; }
        .progress-step.inactive { background:#c4c8d4; }
        .stock-high { background:#dcfce7; color:#166534; border:1.5px solid #bbf7d0; }
        .stock-medium { background:#fef3c7; color:#92400e; border:1.5px solid #fde68a; }
        .stock-low { background:#fecaca; color:#991b1b; border:1.5px solid #fca5a5; }
        .stock-unknown { background:#f3f4f6; color:#6b7280; border:1.5px solid #e5e7eb; }
        .doc-toggle { display:inline-flex; background:#eef0f6; border-radius:10px; padding:4px; gap:4px; }
        .doc-toggle button { border:none; background:transparent; padding:8px 18px; border-radius:8px; font-weight:700; cursor:pointer; color:#4b5563; }
        .doc-toggle button.on { background:linear-gradient(to right,var(--brand1),var(--brand2)); color:#fff; }
        .lightbox-overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); display:flex; align-items:center; justify-content:center; z-index:9999; opacity:0; visibility:hidden; transition:.25s; }
        .lightbox-overlay.visible { opacity:1; visibility:visible; }
        .lightbox-content { max-width:90%; max-height:90%; position:relative; }
        .lightbox-image { display:block; max-width:100vw; max-height:90vh; border-radius:12px; box-shadow:0 0 30px rgba(0,0,0,.5); }
        .lightbox-close { position:absolute; top:8px; right:8px; background:#fff; color:var(--brand1); border:none; border-radius:50%; width:40px; height:40px; font-size:22px; cursor:pointer; font-weight:bold; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
            <div style="text-align:center;">
                <div style="font-size:22px;margin-bottom:20px;">Loading UMORA Invoice Generator…</div>
                <div style="width:44px;height:44px;border:5px solid #eee;border-top:5px solid var(--brand1);border-radius:50%;margin:0 auto;animation:spin 1s linear infinite;"></div>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ---- Number to words (Indian system) ----
        const numberToWordsIndianSystem = (n) => {
            const num = Math.floor(n);
            const words = ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
            const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
            if (num === 0) return 'INR Zero Only';
            const c = (x) => { if(x===0)return''; if(x<20)return words[x]; if(x<100)return tens[Math.floor(x/10)]+(x%10?' '+words[x%10]:''); return words[Math.floor(x/100)]+' Hundred'+(x%100?' '+c(x%100):''); };
            let t = num, r='';
            const groups=[[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand'],[100,'Hundred']];
            for (const [d,u] of groups){ if(t>=d){ r+=c(Math.floor(t/d))+' '+u+' '; t%=d; } }
            if(t>0) r+=c(t);
            const paise = Math.round((n-num)*100);
            let p=''; if(paise>0) p=' and '+c(paise)+' Paise';
            return ('INR '+r.trim().replace(/\s+/g,' ')+p+' Only');
        };

        const DOC_LABELS = { PI: 'PROFORMA INVOICE', TI: 'TAX INVOICE' };

        /* =================================================================
           ORDER SCREENSHOT READER
           Reads WhatsApp price-list screenshots, finds the green tick marks
           the buyer has drawn, and works out which style each tick belongs to.
           ================================================================= */

        // Make sizes comparable: "1-2 Y" / "1-2Yr" / "0-3 Months" -> "1-2Y" / "0-3M"
        const normSize = (s) => String(s == null ? '' : s).toUpperCase().replace(/\s+/g, '')
            .replace(/MONTHS?$/, 'M').replace(/MTHS?$/, 'M').replace(/MOS?$/, 'M')
            .replace(/YEARS?$/, 'Y').replace(/YRS?$/, 'Y').replace(/YR$/, 'Y');

        const SIZE_ORDER = ['0-3M','0-6M','3-6M','6-9M','6-12M','9-12M','12-18M','18-24M','1-2Y','2-3Y','3-4Y','4-5Y','5-6Y','6-7Y','7-8Y','8-9Y','9-10Y'];
        const sizeRank = (n) => { const i = SIZE_ORDER.indexOf(normSize(n)); return i < 0 ? 900 : i; };

        const SKU_RE  = /\bLA\s*([0-9]{2})\s*[_\-–—]?\s*([0-9]{3})\b/i;
        // deliberately loose — OCR often reads "Variant" as "Vanant" and drops the colon
        const VAR_RE  = /\bVA[A-Z]{0,3}N[TI]\s*[:;.,]?\s*([A-Z])\s*([A-Z0-9]{2})\b/i;
        // "Color" often loses its first letters to the product photo beside it
        const COL_RE  = /(?:C[O0]L[O0]U?R|[O0]L[O0]R|\bL[O0]R)\s*[:;.,]?\s+([A-Za-z][A-Za-z \-&+]{1,28})/i;
        const fixDigits = (s) => String(s).toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/S/g, '5').replace(/B/g, '8');

        // small edit-distance helper so "Hlue" still matches "Blue"
        function editDist(a, b) {
            a = String(a); b = String(b);
            const m = a.length, n = b.length;
            if (!m) return n; if (!n) return m;
            let prev = new Array(n + 1), cur = new Array(n + 1);
            for (let j = 0; j <= n; j++) prev[j] = j;
            for (let i = 1; i <= m; i++) {
                cur[0] = i;
                for (let j = 1; j <= n; j++) {
                    cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                }
                const t = prev; prev = cur; cur = t;
            }
            return prev[n];
        }
        const colourKey = (s) => String(s || '').toLowerCase().replace(/[^a-z]/g, '');
        const SIZE_RE = /([0-9]{1,2})\s*[-–—]\s*([0-9]{1,2})\s*(MONTHS?|MTHS?|YEARS?|YRS?|M|Y)\b/ig;

        // --- find blobs of bright hand-drawn green ---
        function findGreenBlobs(canvas) {
            const W = canvas.width, H = canvas.height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const px = ctx.getImageData(0, 0, W, H).data;
            const cell = 5;
            const gw = Math.ceil(W / cell), gh = Math.ceil(H / cell);
            const grid = new Uint8Array(gw * gh);
            for (let y = 0; y < H; y++) {
                const row = y * W;
                for (let x = 0; x < W; x++) {
                    const i = (row + x) * 4, r = px[i], g = px[i + 1], b = px[i + 2];
                    // bright, strongly green — excludes pale green chips and dark green text
                    if (g > 140 && (g - r) > 60 && (g - b) > 45) grid[Math.floor(y / cell) * gw + Math.floor(x / cell)] = 1;
                }
            }
            const seen = new Uint8Array(gw * gh);
            const blobs = [];
            const stack = [];
            for (let i = 0; i < grid.length; i++) {
                if (!grid[i] || seen[i]) continue;
                stack.length = 0; stack.push(i); seen[i] = 1;
                let n = 0, minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
                while (stack.length) {
                    const c = stack.pop();
                    const cy = Math.floor(c / gw), cx = c - cy * gw;
                    n++;
                    if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
                    if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
                    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                        const nx = cx + dx, ny = cy + dy;
                        if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue;
                        const ni = ny * gw + nx;
                        if (grid[ni] && !seen[ni]) { seen[ni] = 1; stack.push(ni); }
                    }
                }
                const bw = (maxX - minX + 1) * cell, bh = (maxY - minY + 1) * cell;
                if (n >= 20 && bw > 22 && bh > 12) {
                    blobs.push({
                        x0: minX * cell, x1: (maxX + 1) * cell, y0: minY * cell, y1: (maxY + 1) * cell,
                        cx: (minX + maxX + 1) / 2 * cell, cy: (minY + maxY + 1) / 2 * cell, area: n * cell * cell
                    });
                }
            }
            return blobs;
        }

        // --- find the white product cards on the page (much more reliable than guessing
        //     the layout from OCR text, because the price list always uses white cards) ---
        function findWhiteCards(canvas) {
            const W = canvas.width, H = canvas.height;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const px = ctx.getImageData(0, 0, W, H).data;
            const cell = 4;
            const gw = Math.ceil(W / cell), gh = Math.ceil(H / cell);
            const grid = new Uint8Array(gw * gh);
            // sample the centre pixel of each cell — cheap and good enough
            for (let cy = 0; cy < gh; cy++) {
                const y = Math.min(H - 1, cy * cell + (cell >> 1));
                for (let cx = 0; cx < gw; cx++) {
                    const x = Math.min(W - 1, cx * cell + (cell >> 1));
                    const i = (y * W + x) * 4, r = px[i], g = px[i + 1], b = px[i + 2];
                    const mn = Math.min(r, g, b), mx = Math.max(r, g, b);
                    if (mn > 232 && (mx - mn) < 14) grid[cy * gw + cx] = 1;
                }
            }
            const seen = new Uint8Array(gw * gh);
            const out = [];
            const stack = [];
            for (let i = 0; i < grid.length; i++) {
                if (!grid[i] || seen[i]) continue;
                stack.length = 0; stack.push(i); seen[i] = 1;
                let n = 0, minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
                while (stack.length) {
                    const c = stack.pop();
                    const cy = (c / gw) | 0, cx = c - cy * gw;
                    n++;
                    if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
                    if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
                    if (cx > 0 && grid[c - 1] && !seen[c - 1]) { seen[c - 1] = 1; stack.push(c - 1); }
                    if (cx < gw - 1 && grid[c + 1] && !seen[c + 1]) { seen[c + 1] = 1; stack.push(c + 1); }
                    if (cy > 0 && grid[c - gw] && !seen[c - gw]) { seen[c - gw] = 1; stack.push(c - gw); }
                    if (cy < gh - 1 && grid[c + gw] && !seen[c + gw]) { seen[c + gw] = 1; stack.push(c + gw); }
                }
                const x0 = minX * cell, x1 = (maxX + 1) * cell, y0 = minY * cell, y1 = (maxY + 1) * cell;
                const bw = x1 - x0, bh = y1 - y0;
                if (bw > W * 0.22 && bw < W * 0.75 && bh > H * 0.08 && bh / bw > 0.5 && bh / bw < 3.2) {
                    out.push({ x0, y0, x1, y1, parent: '', variant: '', color: '', sizes: [] });
                }
            }
            out.sort((a, b) => (a.y0 - b.y0) || (a.x0 - b.x0));
            return out;
        }

        // --- flatten Tesseract output to a flat list of text lines with boxes ---
        function flattenLines(data) {
            const out = [];
            const push = (l) => { if (l && l.bbox && l.text) out.push({ text: String(l.text).trim(), bbox: l.bbox }); };
            if (data.blocks && data.blocks.length) {
                data.blocks.forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(push)));
            }
            if (!out.length && data.lines) data.lines.forEach(push);
            if (!out.length && data.words) data.words.forEach(push);
            return out;
        }

        // word-level boxes — needed because Tesseract glues side-by-side columns into one line
        function flattenWords(data) {
            const out = [];
            const push = (w) => { if (w && w.bbox && w.text && w.text.trim()) out.push({ text: w.text.trim(), bbox: w.bbox }); };
            if (data.blocks && data.blocks.length) {
                data.blocks.forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => (l.words || []).forEach(push))));
            }
            if (!out.length && data.words) data.words.forEach(push);
            return out;
        }

        const SKU_WORD_RE = /^[^A-Z0-9]*LA\s*([0-9]{2})\s*[_\-–—]?\s*([0-9]{3})[^A-Z0-9]*$/i;

        // pull out every SKU heading with its own box, even when two sit side by side
        function findSkuHeadings(data, W) {
            const words = flattenWords(data);
            const hits = [];
            for (let i = 0; i < words.length; i++) {
                const w = words[i];
                let m = w.text.match(SKU_WORD_RE), bb = { ...w.bbox };
                if (!m && i + 1 < words.length) {
                    const n = words[i + 1];
                    if (Math.abs(n.bbox.y0 - w.bbox.y0) < 22 && (n.bbox.x0 - w.bbox.x1) < 70 && (n.bbox.x0 - w.bbox.x1) > -10) {
                        const m2 = (w.text + n.text).replace(/\s+/g, '').match(SKU_WORD_RE);
                        if (m2) { m = m2; bb = { x0: Math.min(bb.x0, n.bbox.x0), x1: Math.max(bb.x1, n.bbox.x1), y0: Math.min(bb.y0, n.bbox.y0), y1: Math.max(bb.y1, n.bbox.y1) }; i++; }
                    }
                }
                if (m) hits.push({ parent: ('LA' + m[1] + '_' + m[2]).toUpperCase(), cx: (bb.x0 + bb.x1) / 2, y: bb.y0, hx0: bb.x0 });
            }
            // line level as well — catches headings the word pass missed; positions are approximate
            flattenLines(data).forEach(l => {
                const all = [...l.text.matchAll(/\bLA\s*([0-9]{2})\s*[_\-–—.]?\s*([0-9]{3})\b/ig)];
                const n = all.length; if (!n) return;
                const seg = (l.bbox.x1 - l.bbox.x0) / n;
                all.forEach((m, k) => {
                    const parent = ('LA' + m[1] + '_' + m[2]).toUpperCase();
                    const cx = l.bbox.x0 + seg * (k + 0.5);
                    if (hits.some(h => h.parent === parent && Math.abs(h.cx - cx) < W * 0.22 && Math.abs(h.y - l.bbox.y0) < 60)) return;
                    hits.push({ parent, cx, y: l.bbox.y0, hx0: l.bbox.x0 + seg * k });
                });
            });
            return hits;
        }

        // --- turn OCR lines into product "cards" laid out in columns ---
        function buildCards(headings, lines, W, H) {
            // drop duplicate readings of the same heading
            const skuLines = [];
            headings.forEach(h => {
                if (!skuLines.some(s => s.parent === h.parent && Math.abs(s.cx - h.cx) < W * 0.12 && Math.abs(s.y - h.y) < 40)) skuLines.push({ ...h });
            });
            if (!skuLines.length) return [];
            // cluster the SKU headings into columns
            const cols = [];
            skuLines.slice().sort((a, b) => a.cx - b.cx).forEach(s => {
                const c = cols.find(c => Math.abs(c.center - s.cx) < W * 0.20);
                if (c) { c.vals.push(s.cx); c.center = c.vals.reduce((a, b) => a + b, 0) / c.vals.length; }
                else cols.push({ center: s.cx, vals: [s.cx] });
            });
            cols.sort((a, b) => a.center - b.center);
            const colIdx = (x) => { let bi = 0, bd = Infinity; cols.forEach((c, i) => { const d = Math.abs(c.center - x); if (d < bd) { bd = d; bi = i; } }); return bi; };
            // left edge of each column = leftmost heading in it; right edge stops just before the next column
            cols.forEach((c, i) => { c.left = Math.min(...skuLines.filter(s => colIdx(s.cx) === i).map(s => (s.hx0 != null ? s.hx0 : s.cx))); });
            const bounds = cols.map((c, i) => ({
                x0: i === 0 ? 0 : Math.max(0, c.left - W * 0.06),
                x1: i === cols.length - 1 ? W : Math.max(c.center + 10, cols[i + 1].left - W * 0.055)
            }));
            const cards = [];
            cols.forEach((c, ci) => {
                const list = skuLines.filter(s => colIdx(s.cx) === ci).sort((a, b) => a.y - b.y);
                list.forEach((s, i) => {
                    cards.push({
                        parent: s.parent, variant: '', color: '', sizes: [],
                        x0: bounds[ci].x0, x1: bounds[ci].x1, hx0: s.hx0 != null ? s.hx0 : bounds[ci].x0, hy: s.y,
                        y0: Math.max(0, s.y - 35),
                        y1: (i + 1 < list.length) ? (list[i + 1].y - 35) : H
                    });
                });
            });
            // pull variant + visible sizes out of the text sitting inside each card
            cards.forEach(cd => {
                lines.forEach(l => {
                    const cx = (l.bbox.x0 + l.bbox.x1) / 2, cy = (l.bbox.y0 + l.bbox.y1) / 2;
                    if (cx < cd.x0 || cx > cd.x1 || cy < cd.y0 || cy > cd.y1) return;
                    if (!cd.variant) { const vm = l.text.match(VAR_RE); if (vm) cd.variant = (vm[1].toUpperCase() + fixDigits(vm[2])); }
                    if (!cd.color) { const cm = l.text.match(COL_RE); if (cm) cd.color = cm[1].trim(); }
                    SIZE_RE.lastIndex = 0;
                    let sm;
                    while ((sm = SIZE_RE.exec(l.text)) !== null) {
                        const unit = /^Y/i.test(sm[3]) ? 'Y' : 'M';
                        const sz = parseInt(sm[1]) + '-' + parseInt(sm[2]) + unit;
                        if (!cd.sizes.includes(sz)) cd.sizes.push(sz);
                    }
                });
            });
            return cards;
        }

        function makeThumb(canvas, w) {
            const t = document.createElement('canvas');
            const s = w / canvas.width;
            t.width = w; t.height = Math.round(canvas.height * s);
            t.getContext('2d').drawImage(canvas, 0, 0, t.width, t.height);
            return t.toDataURL('image/jpeg', 0.6);
        }

        async function loadToCanvas(file) {
            const url = URL.createObjectURL(file);
            const img = await new Promise((res, rej) => {
                const im = new Image();
                im.onload = () => res(im); im.onerror = rej; im.src = url;
            });
            const scale = Math.min(2.4, Math.max(1, 1500 / img.naturalWidth));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.naturalWidth * scale);
            canvas.height = Math.round(img.naturalHeight * scale);
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            URL.revokeObjectURL(url);
            return canvas;
        }

        // crop one card out, blow it up and boost contrast so the small grey text reads
        function cropScaled(canvas, x0, y0, x1, y1, targetW, cap) {
            const w = Math.max(1, Math.round(x1 - x0)), h = Math.max(1, Math.round(y1 - y0));
            const s = Math.min(cap || 3, Math.max(1, targetW / w));
            const c = document.createElement('canvas');
            c.width = Math.round(w * s); c.height = Math.round(h * s);
            const ctx = c.getContext('2d', { willReadFrequently: true });
            ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
            ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(canvas, Math.round(x0), Math.round(y0), w, h, 0, 0, c.width, c.height);
            const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
            for (let i = 0; i < px.length; i += 4) {
                let g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
                g = (g - 132) * 1.9 + 128;
                px[i] = px[i + 1] = px[i + 2] = g < 0 ? 0 : (g > 255 ? 255 : g);
            }
            ctx.putImageData(d, 0, 0);
            return c;
        }

        function readCardDetail(text) {
            const out = { variant: '', color: '', sizes: [] };
            const vm = text.match(VAR_RE); if (vm) out.variant = vm[1].toUpperCase() + fixDigits(vm[2]);
            const cm = text.match(COL_RE); if (cm) out.color = cm[1].trim().replace(/\s+/g, ' ');
            SIZE_RE.lastIndex = 0;
            let sm;
            while ((sm = SIZE_RE.exec(text)) !== null) {
                const unit = /^Y/i.test(sm[3]) ? 'Y' : 'M';
                const sz = parseInt(sm[1]) + '-' + parseInt(sm[2]) + unit;
                if (!out.sizes.includes(sz)) out.sizes.push(sz);
            }
            return out;
        }

        const ocrText = async (worker, img) => flattenLines((await worker.recognize(img, {}, { blocks: true, text: true })).data).map(l => l.text).join('\n');

        // zoom into one card and read it. The photo sits top-left and confuses OCR,
        // so the SKU / colour / variant block is read from the right of it.
        async function readCardZoom(canvas, cd, worker) {
            const w = cd.x1 - cd.x0, h = cd.y1 - cd.y0;
            // two overlapping crops at different magnifications — between them they
            // catch the colour line far more often than either does alone
            const t1a = await ocrText(worker, cropScaled(canvas, cd.x0 + w * 0.40, cd.y0, cd.x1, cd.y0 + h * 0.42, 1150, 3));
            const t1b = await ocrText(worker, cropScaled(canvas, cd.x0 + w * 0.36, cd.y0 + h * 0.08, cd.x1, cd.y0 + h * 0.34, 1200, 4));
            const t1 = t1a + '\n' + t1b;
            const m1 = t1.match(SKU_RE);
            if (m1) cd.parent = ('LA' + m1[1] + '_' + m1[2]).toUpperCase();
            const d1 = readCardDetail(t1a), d1b = readCardDetail(t1b);
            cd.variant = d1.variant || d1b.variant || '';
            cd.color = d1.color || d1b.color || '';
            cd.infoText = t1;
            const t2 = await ocrText(worker, cropScaled(canvas, cd.x0, cd.y0 + h * 0.28, cd.x1, cd.y1, 1250));
            const d2 = readCardDetail(t2);
            if (d2.sizes.length) cd.sizes = d2.sizes;
            if (!cd.color && d2.color) cd.color = d2.color;
            if (!cd.variant && d2.variant) cd.variant = d2.variant;
            if (!cd.parent) { const m2 = t2.match(SKU_RE); if (m2) cd.parent = ('LA' + m2[1] + '_' + m2[2]).toUpperCase(); }
            cd.sizeText = t2;
            return cd;
        }

        async function readOrderScreenshot(file, worker) {
            const canvas = await loadToCanvas(file);
            const blobs = findGreenBlobs(canvas);

            // preferred route: locate the white cards, then read only the ticked ones
            const boxes = findWhiteCards(canvas);
            if (boxes.length >= 2) {
                const hit = boxes.filter(c => blobs.some(b => b.cx >= c.x0 && b.cx <= c.x1 && b.cy >= c.y0 && b.cy <= c.y1));
                if (hit.length) {
                    await worker.setParameters({ tessedit_pageseg_mode: '6' });
                    for (const cd of hit) { try { await readCardZoom(canvas, cd, worker); } catch (e) { } }
                    await worker.setParameters({ tessedit_pageseg_mode: '3' });
                    const good = hit.filter(c => c.parent);
                    if (good.length) return { fileName: file.name, thumb: makeThumb(canvas, 150), cards: boxes, ticked: good, blobCount: blobs.length };
                }
            }

            // fallback: work the layout out from the OCR text itself
            await worker.setParameters({ tessedit_pageseg_mode: '3' });
            const { data } = await worker.recognize(canvas, {}, { blocks: true, text: true });
            const lines = flattenLines(data);
            const cards = buildCards(findSkuHeadings(data, canvas.width), lines, canvas.width, canvas.height);
            const ticked = cards.filter(cd => blobs.some(b => b.cx >= cd.x0 && b.cx <= cd.x1 && b.cy >= cd.y0 && b.cy <= cd.y1));

            // second pass — zoom into the ticked cards only, skipping the product photo
            // (the photo confuses Tesseract's layout analysis and swallows the small grey text)
            if (ticked.length) {
                await worker.setParameters({ tessedit_pageseg_mode: '6' });
                for (const cd of ticked) {
                    const cardH = Math.max(60, cd.y1 - cd.y0);
                    try {
                        const info = cropScaled(canvas, Math.max(0, cd.hx0 - 10), Math.max(0, cd.hy - 14),
                                                cd.x1, Math.min(canvas.height, cd.hy + Math.max(150, cardH * 0.32)), 1300);
                        const t1 = flattenLines((await worker.recognize(info, {}, { blocks: true, text: true })).data).map(l => l.text).join('\n');
                        const d1 = readCardDetail(t1);
                        if (d1.variant) cd.variant = d1.variant;
                        if (d1.color) cd.color = d1.color;
                        cd.infoText = t1;
                    } catch (e) { /* keep first-pass values */ }
                    try {
                        const rows = cropScaled(canvas, cd.x0, Math.min(canvas.height, cd.hy + cardH * 0.22),
                                                cd.x1, Math.min(canvas.height, cd.y1), 1400);
                        const t2 = flattenLines((await worker.recognize(rows, {}, { blocks: true, text: true })).data).map(l => l.text).join('\n');
                        const d2 = readCardDetail(t2);
                        if (d2.sizes.length) cd.sizes = d2.sizes;
                        if (!cd.color && d2.color) cd.color = d2.color;
                        if (!cd.variant && d2.variant) cd.variant = d2.variant;
                        cd.sizeText = t2;
                    } catch (e) { /* keep first-pass values */ }
                }
                await worker.setParameters({ tessedit_pageseg_mode: '3' });
            }
            return { fileName: file.name, thumb: makeThumb(canvas, 150), cards, ticked, blobCount: blobs.length };
        }

        // exposed for troubleshooting from the browser console
        window.UMORA_OCR = { findGreenBlobs, findWhiteCards, flattenLines, flattenWords, buildCards, readOrderScreenshot, readCardZoom, cropScaled, normSize, loadToCanvas };

        function App() {
            const [mode, setMode] = useState('start');          // 'start' | 'flow'
            const [docType, setDocType] = useState('PI');        // 'PI' | 'TI'
            const [editMode, setEditMode] = useState(false);
            const [currentStep, setCurrentStep] = useState(1);

            const [customerData, setCustomerData] = useState({
                date: new Date().toISOString().split('T')[0],
                customerName:'', customerMobile:'', city:'', pincode:''
            });
            const [invoiceData, setInvoiceData] = useState({
                customerName:'', addressLine1:'', addressLine2:'', city:'', pincode:'', state:'', gstNo:'',
                contactPerson:'', contactDetails:'', totalCartons:'', ewayBillNumber:'',
                paymentTerms:'100% ADVANCE', customPaymentTerms:'', logisticsCharges:0, cashDiscount:0,
                piNumber:'13/2025-26'
            });

            const [products, setProducts] = useState([]);
            const [categories, setCategories] = useState([]);
            const [currentCategory, setCurrentCategory] = useState(0);
            const [uploadedCSV, setUploadedCSV] = useState(null);
            const [orderData, setOrderData] = useState({});
            const [orderSummary, setOrderSummary] = useState({ totalItems:0, totalValue:0 });

            const [inventoryData, setInventoryData] = useState({});
            const [uploadedInventoryFiles, setUploadedInventoryFiles] = useState([]);
            const [inventoryStats, setInventoryStats] = useState({ totalSKUs:0, matchedSKUs:0, unknownSKUs:0 });
            const [showDownloadOptions, setShowDownloadOptions] = useState(false);
            const [notice, setNotice] = useState('');
            const [lightbox, setLightbox] = useState({ visible:false, imageUrl:'' });

            // --- bulk fill by style ---
            const [selectMode, setSelectMode] = useState(false);
            const [selectedGroups, setSelectedGroups] = useState([]);   // ["LA15_170_C01", ...]
            const [bulkOpen, setBulkOpen] = useState(false);
            const [bulkQty, setBulkQty] = useState({});                  // { "0-3M": 1 }
            const [bulkAll, setBulkAll] = useState('');
            const [bulkMode, setBulkMode] = useState('set');             // 'set' | 'add'
            const [bulkCap, setBulkCap] = useState(true);

            // --- order screenshots ---
            const [shotOpen, setShotOpen] = useState(false);
            const [shotBusy, setShotBusy] = useState(null);              // { done, total, label }
            const [shotRows, setShotRows] = useState([]);
            const [shotMisses, setShotMisses] = useState([]);
            const [shotDefaultQty, setShotDefaultQty] = useState(1);

            const fileInputRef = useRef(null);
            const inventoryFileInputRef = useRef(null);
            const editInputRef = useRef(null);
            const shotInputRef = useRef(null);

            const flash = (msg) => { setNotice(msg); setTimeout(()=>setNotice(''), 4000); };
            const openLightbox = (u) => setLightbox({ visible:true, imageUrl:u });
            const closeLightbox = () => setLightbox({ visible:false, imageUrl:'' });

            // ---- Totals ----
            useEffect(() => {
                let totalItems=0, totalValue=0;
                Object.keys(orderData).forEach(sku => {
                    const q = orderData[sku];
                    if (q>0){ const p=products.find(x=>x['Child SKU Code']===sku); if(p){ totalItems+=q; totalValue+=q*parseFloat(p.WSP||0); } }
                });
                setOrderSummary({ totalItems, totalValue: totalValue.toFixed(2) });
            }, [orderData, products]);

            // ---- Inventory stats ----
            useEffect(() => {
                if (products.length>0){
                    const uniq=[...new Set(products.map(p=>p['Child SKU Code']))].filter(Boolean);
                    const matched=uniq.filter(s=>inventoryData[s.toUpperCase()]!==undefined);
                    setInventoryStats({ totalSKUs:uniq.length, matchedSKUs:matched.length, unknownSKUs:uniq.length-matched.length });
                }
            }, [products, inventoryData]);

            // ---- Catalog upload ----
            const handleCSVUpload = (event) => {
                const file = event.target.files[0]; if(!file) return;
                Papa.parse(file, { header:true, dynamicTyping:true, skipEmptyLines:true,
                    complete: (res) => {
                        const cleaned = res.data.map(row => {
                            const cr={};
                            Object.keys(row).forEach(k => {
                                let ck=k.replace(/[^a-zA-Z0-9\s]/g,'').trim();
                                if (k.toLowerCase().includes('image') && k.toLowerCase().includes('url')) ck='Image URL';
                                cr[ck]=row[k];
                            });
                            return cr;
                        }).filter(r=>r['Child SKU Code']);
                        setProducts(cleaned);
                        setCategories([...new Set(cleaned.map(i=>i.Category))].filter(Boolean));
                        setUploadedCSV(file.name);
                        flash('✅ Catalog loaded: '+cleaned.length+' products.');
                    },
                    error: (e) => flash('❌ Catalog error: '+e.message)
                });
                event.target.value='';
            };

            // ---- Inventory upload (MULTIPLE files clubbed) ----
            const handleInventoryUpload = (event) => {
                const files = Array.from(event.target.files); if(!files.length) return;
                let pending = files.length;
                const merged = { ...inventoryData };
                const names = [...uploadedInventoryFiles];
                files.forEach(file => {
                    Papa.parse(file, { header:true, dynamicTyping:true, skipEmptyLines:true,
                        complete: (res) => {
                            res.data.forEach(row => {
                                const cr={}; Object.keys(row).forEach(k=>cr[k.trim()]=row[k]);
                                let sku = cr.sku || cr.SKU || cr['Child SKU Code'];
                                const qty = parseInt(cr.old_quantity || cr.quantity || cr.stock || cr.Stock || 0);
                                if (sku){
                                    sku = String(sku).toUpperCase();
                                    if (sku.startsWith('SZ')) sku='LA'+sku.substring(2);
                                    merged[sku] = qty;
                                }
                            });
                            names.push(file.name);
                            if (--pending===0){
                                setInventoryData(merged);
                                setUploadedInventoryFiles(names);
                                flash('✅ Inventory clubbed from '+names.length+' file(s): '+Object.keys(merged).length+' SKUs.');
                            }
                        },
                        error: (e) => { if(--pending===0){ setInventoryData(merged); setUploadedInventoryFiles(names);} flash('❌ Inventory error: '+e.message); }
                    });
                });
                event.target.value='';
            };

            // ---- Use stock straight from catalog's Stock column ----
            const useCatalogStock = () => {
                if (!products.length){ flash('⚠️ Upload the catalog first.'); return; }
                const map={};
                products.forEach(p => {
                    const sku=p['Child SKU Code']; const st=p.Stock;
                    if (sku && st!==undefined && st!=='' && st!==null) map[String(sku).toUpperCase()]=parseInt(st)||0;
                });
                if (!Object.keys(map).length){ flash('⚠️ No "Stock" column found in catalog.'); return; }
                setInventoryData(map);
                setUploadedInventoryFiles(['(from catalog Stock column)']);
                flash('✅ Using stock from catalog: '+Object.keys(map).length+' SKUs.');
            };

            const getStockInfo = (sku) => {
                const s = inventoryData[String(sku).toUpperCase()];
                if (s===undefined) return { quantity:null, status:'unknown', className:'stock-unknown' };
                if (s>=50) return { quantity:s, status:'high', className:'stock-high' };
                if (s>=10) return { quantity:s, status:'medium', className:'stock-medium' };
                return { quantity:s, status:'low', className:'stock-low' };
            };

            const groupProductsByParentAndVariant = (catProducts) => {
                const g={};
                catProducts.forEach(p => {
                    const parent=p['Parent SKU Code']; const child=p['Child SKU Code'];
                    let variant = (child && child.length>11) ? child.substring(9,12) : (p.Color||'DEFAULT');
                    const key=`${parent}_${variant}`;
                    if(!g[key]) g[key]={ parentSKU:parent, variant, color:p.Color, category:p.Category, mrp:p.MRP, imageUrl:p['Image URL']?String(p['Image URL']).trim():'', hsn:p.HSN, sizes:[] };
                    g[key].sizes.push({ size:p.Size, childSKU:child, wsp:p.WSP });
                });
                return Object.values(g);
            };

            const handleQuantityChange = (sku, quantity) => {
                const info=getStockInfo(sku);
                const qty = quantity===''?0:(parseInt(quantity)||0);
                if (info.quantity!==null && qty>info.quantity){ flash(`❌ Only ${info.quantity} in stock for ${sku}.`); return; }
                setOrderData(prev => { const n={...prev}; if(qty<=0) delete n[sku]; else n[sku]=qty; return n; });
            };

            const getCurrentCategoryProducts = () => categories.length? products.filter(p=>p.Category===categories[currentCategory]) : [];

            /* ============ BULK FILL BY STYLE (parent SKU + colour) ============ */

            const allGroups = React.useMemo(() => groupProductsByParentAndVariant(products), [products]);
            const gKey = (g) => `${g.parentSKU}_${g.variant}`;
            const groupByKey = React.useMemo(() => { const m={}; allGroups.forEach(g=>m[gKey(g)]=g); return m; }, [allGroups]);

            const toggleGroup = (key) => setSelectedGroups(prev => prev.includes(key) ? prev.filter(k=>k!==key) : [...prev, key]);

            const selectAllInCategory = () => {
                const keys = groupProductsByParentAndVariant(getCurrentCategoryProducts()).map(gKey);
                setSelectedGroups(prev => [...new Set([...prev, ...keys])]);
                setSelectMode(true);
            };
            const clearSelection = () => setSelectedGroups([]);

            // every size that appears in at least one selected style, de-duplicated
            // ("3-6 M" and "3-6M" in the catalog are the same size) and in age order
            const selectedSizes = () => {
                const map = {};
                selectedGroups.forEach(k => { const g=groupByKey[k]; if(g) g.sizes.forEach(s=>{ const n=normSize(s.size); if(!map[n]) map[n]=s.size; }); });
                return Object.keys(map).sort((a,b)=>sizeRank(a)-sizeRank(b)).map(n=>({ norm:n, label:map[n] }));
            };

            const openBulk = () => {
                if (!selectedGroups.length){ flash('⚠️ Tick at least one style first.'); return; }
                const init={}; selectedSizes().forEach(s=>init[s.norm]='');
                setBulkQty(init); setBulkAll(''); setBulkMode('set'); setBulkOpen(true);
            };

            const applyBulkAllSizes = (val) => {
                const v = String(val).trim();
                const next={}; Object.keys(bulkQty).forEach(s=>next[s]=v);
                setBulkQty(next);
            };

            const executeBulk = () => {
                const next = { ...orderData };
                let applied=0, capped=0, skipped=0;
                selectedGroups.forEach(k => {
                    const g = groupByKey[k]; if(!g) return;
                    g.sizes.forEach(s => {
                        const raw = bulkQty[normSize(s.size)];
                        if (raw===undefined || String(raw).trim()==='') return;   // untouched
                        let q = parseInt(raw)||0;
                        if (bulkMode==='add') q = (next[s.childSKU]||0) + q;
                        const info = getStockInfo(s.childSKU);
                        if (bulkCap && info.quantity!==null && q>info.quantity){ q=info.quantity; capped++; }
                        if (q<=0){ delete next[s.childSKU]; skipped++; return; }
                        next[s.childSKU]=q; applied++;
                    });
                });
                setOrderData(next); setBulkOpen(false);
                flash(`⚡ Filled ${applied} size(s) across ${selectedGroups.length} style(s)`+(capped?` · ${capped} trimmed to available stock`:'')+(skipped?` · ${skipped} skipped (no stock)`:''));
            };

            /* ============ ORDER SCREENSHOTS ============ */

            // catalog sizes available for a given parent+variant
            const sizesForGroup = (g) => g.sizes.map(s => ({
                size: s.size, norm: normSize(s.size), childSKU: s.childSKU, wsp: s.wsp,
                stock: getStockInfo(s.childSKU).quantity
            })).sort((a,b)=>sizeRank(a.norm)-sizeRank(b.norm));

            const variantsOf = (parent) => allGroups.filter(g => String(g.parentSKU).toUpperCase() === String(parent).toUpperCase());

            // work out which colour of a style the buyer ticked, forgiving OCR slips
            const findGroupFor = (parent, variant, color) => {
                const cands = variantsOf(parent);
                if (!cands.length) return null;
                if (cands.length === 1) return cands[0];
                if (variant){
                    const v = String(variant).toUpperCase();
                    const exact = cands.find(g => String(g.variant).toUpperCase() === v);
                    if (exact) return exact;
                    const near = cands.filter(g => editDist(String(g.variant).toUpperCase(), v) <= 1);
                    if (near.length === 1) return near[0];
                }
                const c = colourKey(color);
                if (c.length >= 3){
                    const exact = cands.find(g => colourKey(g.color) === c);
                    if (exact) return exact;
                    // OCR often adds trailing junk — allow a clean prefix match
                    const pre = cands.filter(g => { const k = colourKey(g.color); return k.length >= 4 && (c.startsWith(k) || k.startsWith(c)); });
                    if (pre.length === 1) return pre[0];
                    const scored = cands.map(g => ({ g, d: editDist(colourKey(g.color), c) })).sort((a, b) => a.d - b.d);
                    const lim = Math.max(1, Math.floor(c.length * 0.28));
                    if (scored.length && scored[0].d <= lim && (scored.length === 1 || scored[1].d > scored[0].d)) return scored[0].g;
                }
                return null;
            };

            const makeShotRow = (key, g, seen, thumb, file) => {
                const cat = sizesForGroup(g);
                const inStock = cat.filter(s => s.stock===null || s.stock>0);
                return {
                    key, group:g, parent:g.parentSKU, variant:g.variant, color:g.color, ocrColor:'',
                    options:null, catSizes:cat, seenSizes:seen,
                    sizes:(inStock.length?inStock:cat).map(s=>s.norm),
                    qty:shotDefaultQty, include:true, thumb, file
                };
            };

            // user picked the colour for a style OCR couldn't pin down
            const shotResolve = (key, variantCode) => setShotRows(prev => prev.map(r => {
                if (r.key!==key) return r;
                const g = (r.options||[]).find(o=>String(o.variant)===String(variantCode));
                if (!g) return r;
                return { ...makeShotRow(r.key, g, r.seenSizes, r.thumb, r.file), qty:r.qty, include:true };
            }));

            const handleScreenshotUpload = async (event) => {
                const files = Array.from(event.target.files||[]); event.target.value='';
                if (!files.length) return;
                if (!products.length){ flash('⚠️ Upload the catalog first (Step 2).'); return; }
                if (!window.Tesseract){ flash('❌ Screenshot reader failed to load — check your internet connection and refresh.'); return; }
                setShotBusy({ done:0, total:files.length, label:'Starting the reader (the first run downloads a small language pack)…' });
                let worker;
                try {
                    worker = await window.Tesseract.createWorker('eng', 1, window.UMORA_TESS_OPTS || {});
                } catch (err){
                    setShotBusy(null); flash('❌ Could not start the screenshot reader: '+err.message); return;
                }
                const rows = [...shotRows];
                const misses = [...shotMisses];
                let seq = rows.length;
                for (let i=0;i<files.length;i++){
                    setShotBusy({ done:i, total:files.length, label:'Reading '+files[i].name });
                    try {
                        const res = await readOrderScreenshot(files[i], worker);
                        res.ticked.forEach(t => {
                            const g = findGroupFor(t.parent, t.variant, t.color);
                            const seen = (t.sizes||[]).map(normSize);
                            if (g){
                                const k = g.parentSKU+'|'+g.variant;
                                if (rows.some(r=>r.key===k)) return;                    // same style ticked twice
                                rows.push(makeShotRow(k, g, seen, res.thumb, files[i].name));
                                return;
                            }
                            const opts = variantsOf(t.parent);
                            if (!opts.length){
                                misses.push({ parent:t.parent, variant:t.variant, color:t.color, file:files[i].name, note:'this style is not in the catalog you uploaded' });
                                return;
                            }
                            // style is in the catalog but we couldn't tell which colour — let the user pick
                            rows.push({
                                key:'?'+(seq++), group:null, parent:t.parent, variant:t.variant||'', color:'',
                                ocrColor:t.color||'', options:opts, catSizes:[], seenSizes:seen, sizes:[],
                                qty:shotDefaultQty, include:true, thumb:res.thumb, file:files[i].name
                            });
                        });
                        if (!res.ticked.length){
                            misses.push({ parent:'—', variant:'', color:'', file:files[i].name,
                                note: res.blobCount ? 'green marks found but the style could not be read' : 'no green tick found in this image' });
                        }
                    } catch (err){
                        misses.push({ parent:'—', variant:'', color:'', file:files[i].name, note:'could not read: '+err.message });
                    }
                }
                try { await worker.terminate(); } catch(e){}
                setShotRows(rows); setShotMisses(misses); setShotBusy(null);
                flash(`📸 Found ${rows.length} ticked style(s) from ${files.length} screenshot(s).`);
            };

            const shotSetQty = (key, v) => setShotRows(prev => prev.map(r => r.key===key ? { ...r, qty: v===''?'':(parseInt(v)||0) } : r));
            const shotToggleSize = (key, norm) => setShotRows(prev => prev.map(r => r.key!==key ? r :
                ({ ...r, sizes: r.sizes.includes(norm) ? r.sizes.filter(s=>s!==norm) : [...r.sizes, norm] })));
            const shotToggleInclude = (key) => setShotRows(prev => prev.map(r => r.key===key ? { ...r, include:!r.include } : r));
            const shotRemove = (key) => setShotRows(prev => prev.filter(r=>r.key!==key));
            const shotApplyQtyAll = (v) => { const q=parseInt(v)||0; setShotDefaultQty(q); setShotRows(prev=>prev.map(r=>({...r, qty:q}))); };
            const shotOnlySeen = () => setShotRows(prev => prev.map(r => r.group ? ({ ...r, sizes: r.seenSizes.filter(s=>r.catSizes.some(c=>c.norm===s)) }) : r));
            const shotAllSizes  = () => setShotRows(prev => prev.map(r => r.group ? ({ ...r, sizes: r.catSizes.map(c=>c.norm) }) : r));

            const applyScreenshotRows = () => {
                const next = { ...orderData };
                let applied=0, capped=0, zero=0;
                shotRows.filter(r=>r.include && r.group).forEach(r => {
                    const q0 = parseInt(r.qty)||0;
                    if (q0<=0) return;
                    r.sizes.forEach(norm => {
                        const s = r.catSizes.find(c=>c.norm===norm); if(!s) return;
                        let q=q0;
                        if (s.stock!==null && q>s.stock){ q=s.stock; capped++; }
                        if (q<=0){ zero++; return; }
                        next[s.childSKU]=q; applied++;
                    });
                });
                setOrderData(next); setShotOpen(false);
                flash(`✅ Added ${applied} line(s) from screenshots`+(capped?` · ${capped} trimmed to stock`:'')+(zero?` · ${zero} out of stock`:''));
            };

            const resetShots = () => { setShotRows([]); setShotMisses([]); };

            const validateCustomerInfo = () => {
                const { customerName, customerMobile, city, pincode } = customerData;
                return customerName.trim() && /^\d{10}$/.test(customerMobile) && city.trim() && /^\d{6}$/.test(pincode);
            };

            const indianStates = ['Andhra Pradesh','Arunachal Pradesh','Assam','Bihar','Chhattisgarh','Goa','Gujarat','Haryana','Himachal Pradesh','Jharkhand','Karnataka','Kerala','Madhya Pradesh','Maharashtra','Manipur','Meghalaya','Mizoram','Nagaland','Odisha','Punjab','Rajasthan','Sikkim','Tamil Nadu','Telangana','Tripura','Uttar Pradesh','Uttarakhand','West Bengal','Andaman and Nicobar Islands','Chandigarh','Dadra and Nagar Haveli and Daman and Diu','Delhi','Jammu and Kashmir','Ladakh','Lakshadweep','Puducherry'];

            const proceedToInvoice = () => {
                setInvoiceData(prev => ({ ...prev, customerName:customerData.customerName, city:customerData.city, pincode:customerData.pincode, contactDetails:customerData.customerMobile }));
                setCurrentStep(5);
            };

            const calculateInvoiceTotals = () => {
                const entries = Object.keys(orderData).filter(s=>orderData[s]>0);
                let totalQty=0, totalValue=0;
                entries.forEach(s => { const q=orderData[s]; const p=products.find(x=>x['Child SKU Code']===s); if(p){ totalQty+=q; totalValue+=q*parseFloat(p.WSP||0);} });
                const discountAmount=(totalValue*invoiceData.cashDiscount)/100;
                const netAmount=totalValue-discountAmount+parseFloat(invoiceData.logisticsCharges||0);
                const isMaharashtra=invoiceData.state.toLowerCase().includes('maharashtra');
                const gstAmount=(netAmount*5)/100;
                const finalAmount=netAmount+gstAmount;
                return { totalQty, totalValue, discountAmount, netAmount, gstAmount, finalAmount, isMaharashtra,
                    cgst:isMaharashtra?gstAmount/2:0, sgst:isMaharashtra?gstAmount/2:0, igst:!isMaharashtra?gstAmount:0 };
            };

            const getOrderProductsWithIndex = () => Object.keys(orderData)
                .filter(s=>orderData[s]>0)
                .map(s => ({ childSKU:s, quantity:orderData[s], product:products.find(p=>p['Child SKU Code']===s) }))
                .filter(i=>i.product)
                .sort((a,b)=>String(a.product['Parent SKU Code']).localeCompare(String(b.product['Parent SKU Code'])));

            // ---- Import existing invoice (HTML / CSV / Excel / PDF) ----
            const num = (v) => { const n=parseFloat(String(v==null?'':v).replace(/[^0-9.]/g,'')); return isNaN(n)?0:n; };
            const KNOWN_SIZES = ['0-3Months-1','0-3Months','6-12M','3-6M','0-3M','0-6M','6-9M','9-12M','12-18M','18-24M','1-2Y','2-3Y','3-4Y','4-5Y','5-6Y','6-7Y','7-8Y'];

            const blankImport = () => ({
                docType:'PI',
                customerData:{ date:new Date().toISOString().split('T')[0], customerName:'', customerMobile:'', city:'', pincode:'' },
                invoiceData:{ customerName:'', addressLine1:'', addressLine2:'', city:'', pincode:'', state:'', gstNo:'', contactPerson:'', contactDetails:'', totalCartons:'', ewayBillNumber:'', paymentTerms:'100% ADVANCE', customPaymentTerms:'', logisticsCharges:0, cashDiscount:0, piNumber:'' },
                lineItems:[]
            });

            const setPaymentTerms = (inv, val) => {
                if (!val) return;
                if (/100%\s*advance/i.test(val)) inv.paymentTerms='100% ADVANCE';
                else { inv.paymentTerms='OTHER'; inv.customPaymentTerms=val; }
            };

            const applyLabel = (imp, label, value) => {
                const k = String(label).toLowerCase().replace(/[:*]/g,'').trim();
                const v = value==null?'':String(value).trim();
                const inv = imp.invoiceData;
                if (k.includes('tax invoice')) imp.docType='TI';
                if ((k.includes('document number')||k.includes('invoice number')||k==='pi number'||k.includes('pi number')||k==='invoice no'||k.includes('invoice no')) && !k.includes('e-way')) inv.piNumber=v;
                else if (k==='date' || k.includes('invoice date')) imp.customerData.date=v;
                else if (k.includes('customer name')) { inv.customerName=v; imp.customerData.customerName=v; }
                else if (k.includes('address line 1')) inv.addressLine1=v;
                else if (k.includes('address line 2')) inv.addressLine2=v;
                else if (k==='city' || k.includes('city')) { inv.city=v; imp.customerData.city=v; }
                else if (k.includes('pincode') || k.includes('pin code')) { inv.pincode=v; imp.customerData.pincode=v; }
                else if (k==='state' || k.includes('state')) inv.state=v;
                else if (k.includes('gst number') || k.includes('gst no')) inv.gstNo=v;
                else if (k.includes('contact person')) inv.contactPerson=v;
                else if (k.includes('contact details')) { inv.contactDetails=v; imp.customerData.customerMobile=v.replace(/\D/g,'').slice(-10); }
                else if (k.includes('total cartons')) inv.totalCartons=v;
                else if (k.includes('e-way') || k.includes('eway')) inv.ewayBillNumber=v;
                else if (k.includes('payment terms')) setPaymentTerms(inv, v);
                else if (k.includes('logistics')) inv.logisticsCharges = /free/i.test(v)?0:num(v);
                else if (k.includes('cash discount')) inv.cashDiscount = num(v);
            };

            // Parse array-of-arrays (from CSV or Excel) — labelled rows + product table
            const parseAOA = (rows) => {
                const imp = blankImport();
                const joined = rows.map(r => (r||[]).map(c=>c==null?'':String(c)));
                // detect doc type from top rows
                joined.slice(0,6).forEach(r => { if (r.some(c=>/tax invoice/i.test(c))) imp.docType='TI'; });
                // find product header row
                let hIdx=-1, col={};
                for (let i=0;i<joined.length;i++){
                    const low = joined[i].map(c=>c.toLowerCase());
                    if (low.some(c=>c.includes('product code')) && low.some(c=>c.includes('qty')||c.includes('quantity'))){
                        hIdx=i;
                        low.forEach((c,ci)=>{
                            if (c.includes('parent')) col.parent=ci;
                            else if (c.includes('product code')) col.child=ci;
                            else if (c==='size'||c.includes('size')) col.size=ci;
                            else if (c.includes('category')) col.category=ci;
                            else if (c.includes('color')||c.includes('colour')) col.color=ci;
                            else if (c.includes('hsn')) col.hsn=ci;
                            else if (c.includes('qty')||c.includes('quantity')) col.qty=ci;
                            else if (c==='mrp'||c.includes('mrp')) col.mrp=ci;
                            else if (c.includes('rate')) col.rate=ci;
                        });
                        break;
                    }
                }
                // labelled fields (before product table)
                joined.forEach((r,i) => { if (hIdx===-1 || i<hIdx) { if (r[0] && r[1]!==undefined && String(r[1]).trim()!=='' ) applyLabel(imp, r[0], r[1]); } });
                // also scan rows after table for totals labels (discount/logistics)
                if (hIdx>=0){
                    for (let i=hIdx+1;i<joined.length;i++){
                        const r=joined[i]; const c0=(r[0]||'').toLowerCase();
                        const childVal = r[col.child];
                        if (childVal && /LA\S+/i.test(childVal)){
                            imp.lineItems.push({ quantity: parseInt(num(r[col.qty]))||1, product:{
                                'Parent SKU Code': r[col.parent]||'', 'Child SKU Code': String(childVal).trim(),
                                'Color': r[col.color]||'', 'Size': r[col.size]||'', 'Category': r[col.category]||'',
                                'MRP': num(r[col.mrp]), 'WSP': num(r[col.rate]), 'HSN': r[col.hsn]||'', 'Image URL': ''
                            }});
                        } else if (c0.includes('cash discount')||c0.includes('logistics')||c0.includes('payment terms')) applyLabel(imp, r[0], r[1]);
                    }
                }
                return imp;
            };

            // Parse PDF plain text (best-effort; SKU/size/qty/price reliable)
            const parsePdfText = (text) => {
                const imp = blankImport();
                if (/tax invoice/i.test(text)) imp.docType='TI';
                const lines = text.split(/\n/).map(l=>l.trim()).filter(Boolean);
                // header fields — the buyer block is one glued line; extract with regexes
                const grab = (re) => { const m=text.match(re); return m?m[1].trim():''; };
                imp.invoiceData.piNumber = grab(/INVOICE#\s*([^\s]+)/i) || grab(/Document Number:?\s*([^\n]+)/i);
                imp.invoiceData.customerName = grab(/CUSTOMER NAME:\s*(.*?)(?:ADDRESS LINE 1:|$)/is);
                imp.invoiceData.addressLine1 = grab(/ADDRESS LINE 1:\s*(.*?)(?:ADDRESS LINE 2:|CITY:|$)/is);
                imp.invoiceData.addressLine2 = grab(/ADDRESS LINE 2:\s*(.*?)(?:CITY:|$)/is);
                imp.invoiceData.city = grab(/CITY:\s*(.*?)(?:PINCODE:|$)/is);
                imp.invoiceData.pincode = grab(/PINCODE:\s*(.*?)(?:STATE:|$)/is);
                imp.invoiceData.state = grab(/STATE:\s*(.*?)(?:GST NO:|GST NUMBER:|$)/is);
                imp.invoiceData.gstNo = grab(/GST NO:\s*(.*?)(?:CONTACT PERSON:|$)/is);
                imp.invoiceData.contactPerson = grab(/CONTACT PERSON:\s*(.*?)(?:CONTACT DETAILS:|$)/is);
                imp.invoiceData.contactDetails = grab(/CONTACT DETAILS:\s*(.*?)(?:BANKING|$)/is);
                imp.invoiceData.totalCartons = grab(/TOTAL CARTONS:\s*(.*?)(?:E-WAY|$)/is);
                imp.invoiceData.ewayBillNumber = grab(/E-WAY BILL:\s*(.*?)(?:PAYMENT TERMS:|$)/is);
                setPaymentTerms(imp.invoiceData, grab(/PAYMENT TERMS:\s*(.*?)(?:LOGISTICS|$)/is));
                const lg = grab(/LOGISTICS CHARGES:\s*(.*?)(?:\n|$)/is); imp.invoiceData.logisticsCharges = /free/i.test(lg)?0:num(lg);
                imp.customerData.customerName = imp.invoiceData.customerName;
                imp.customerData.city = imp.invoiceData.city;
                imp.customerData.pincode = imp.invoiceData.pincode;
                imp.customerData.customerMobile = imp.invoiceData.contactDetails.replace(/\D/g,'').slice(-10);
                // product lines
                const tail = /(\d{8})\s*(?:₹|Rs\.?|INR)?\s*(\d+)\s*(?:₹|Rs\.?|INR)\s*([\d.]+)\s*(?:₹|Rs\.?|INR)\s*([\d.]+)\s*(?:₹|Rs\.?|INR)\s*([\d.]+)\s*$/;
                const head = /^(\d+)\s+(LA\S+)/;
                lines.forEach(l => {
                    const mt = l.match(tail), mh = l.match(head);
                    if (!(mt && mh)) return;
                    let token = mh[2];
                    for (const s of KNOWN_SIZES){ if (token.endsWith(s+s)){ token=token.slice(0,-s.length); break; } }
                    const child = token;
                    const size = child.split('_').pop();
                    let mid = l.slice(mh[0].length, l.length - mt[0].length).trim();
                    for (const s of KNOWN_SIZES){ if (mid.startsWith(s)){ mid=mid.slice(s.length).trim(); break; } }
                    mid = mid.replace(/\d{8}.*$/,'').trim(); // drop any glued trailing hsn
                    imp.lineItems.push({ quantity: parseInt(mt[2])||1, product:{
                        'Parent SKU Code': child.split('_').slice(0,2).join('_'),
                        'Child SKU Code': child, 'Color': '', 'Size': size, 'Category': mid,
                        'MRP': num(mt[3]), 'WSP': num(mt[4]), 'HSN': mt[1], 'Image URL': ''
                    }});
                });
                return imp;
            };

            const applyImported = (imp, label, wasPdf) => {
                if (!imp.lineItems.length){ flash('❌ Could not find any product lines in '+label+'. Try the Excel/CSV version.'); return; }
                setDocType(imp.docType || 'PI');
                setCustomerData(prev => ({ ...prev, ...imp.customerData }));
                setInvoiceData(prev => ({ ...prev, ...imp.invoiceData }));
                const prods = imp.lineItems.map(it => it.product);
                setProducts(prods);
                setCategories([...new Set(prods.map(p=>p.Category))].filter(Boolean));
                const od={}; imp.lineItems.forEach(it => { od[it.product['Child SKU Code']] = it.quantity; });
                setOrderData(od);
                setUploadedCSV('(imported from '+label+')');
                setEditMode(true); setMode('flow'); setCurrentStep(5);
                flash('✏️ Imported '+imp.lineItems.length+' items from '+label+(wasPdf?' — check Color/Category (PDF glues these; Excel/CSV is exact).':' — edit and re-download.'));
            };

            const loadExistingInvoice = (event) => {
                const file = event.target.files[0]; if(!file) return;
                const name = file.name.toLowerCase();
                const done = () => { event.target.value=''; };
                try {
                    if (name.endsWith('.html') || name.endsWith('.htm')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const text = e.target.result;
                            const m = text.match(/<script id="umora-pi-data" type="application\/json">([\s\S]*?)<\/script>/);
                            if (m) {
                                try { const data = JSON.parse(m[1]); applyImported({ docType:data.docType, customerData:data.customerData||{}, invoiceData:data.invoiceData||{}, lineItems:data.lineItems||[] }, file.name, false); }
                                catch (err){ flash('❌ Corrupt invoice data: '+err.message); }
                            } else {
                                // fall back to scraping the printed table out of the HTML
                                const div=document.createElement('div'); div.innerHTML=text;
                                const rows=[...div.querySelectorAll('tr')].map(tr=>[...tr.querySelectorAll('th,td')].map(td=>td.textContent));
                                const imp=parseAOA(rows);
                                // also read labelled DIVs
                                div.querySelectorAll('div').forEach(d=>{ const t=d.textContent||''; const mm=t.match(/^([A-Z][A-Z0-9 \/-]+?):\s*(.+)$/); if(mm) applyLabel(imp, mm[1], mm[2]); });
                                applyImported(imp, file.name, false);
                            }
                            done();
                        };
                        reader.readAsText(file);
                    } else if (name.endsWith('.csv')) {
                        Papa.parse(file, { header:false, skipEmptyLines:true, complete:(res)=>{ applyImported(parseAOA(res.data), file.name, false); done(); }, error:(e)=>{ flash('❌ CSV error: '+e.message); done(); } });
                    } else if (name.endsWith('.xlsx') || name.endsWith('.xls')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try { const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}); applyImported(parseAOA(rows), file.name, false); }
                            catch (err){ flash('❌ Excel error: '+err.message); }
                            done();
                        };
                        reader.readAsArrayBuffer(file);
                    } else if (name.endsWith('.pdf')) {
                        if (!window.pdfjsLib){ flash('❌ PDF reader not loaded — check your internet, or use the Excel/CSV version.'); done(); return; }
                        const reader = new FileReader();
                        reader.onload = async (e) => {
                            try {
                                const pdf = await window.pdfjsLib.getDocument({ data:new Uint8Array(e.target.result) }).promise;
                                let text='';
                                for (let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const tc=await page.getTextContent(); let last=null; tc.items.forEach(it=>{ if(last!==null && it.transform[5]<last-2) text+='\n'; text+=it.str+' '; last=it.transform[5]; }); text+='\n'; }
                                applyImported(parsePdfText(text), file.name, true);
                            } catch (err){ flash('❌ PDF error: '+err.message+' — try the Excel/CSV version.'); }
                            done();
                        };
                        reader.readAsArrayBuffer(file);
                    } else { flash('❌ Unsupported file. Use .html, .csv, .xlsx or .pdf'); done(); }
                } catch (err){ flash('❌ Import failed: '+err.message); done(); }
            };

            // ---- Build invoice HTML (with embedded editable data) ----
            const generateInvoiceHTML = () => {
                const totals = calculateInvoiceTotals();
                const orderProducts = getOrderProductsWithIndex();
                const qrCodeUrl = "https://cdn.shopify.com/s/files/1/0612/8861/1913/files/Umora_UP_QR_200_pixel_x_205_pixel.jpg?v=1759408517";
                const signatureImageUrl = "https://cdn.shopify.com/s/files/1/0612/8861/1913/files/Stamp_signature_100_x_100_pixels.png?v=1759754504";
                const totalInWords = numberToWordsIndianSystem(totals.finalAmount);
                const heading = DOC_LABELS[docType];

                const embed = {
                    version: 2,
                    docType,
                    generatedAt: new Date().toISOString(),
                    customerData,
                    invoiceData,
                    lineItems: orderProducts.map(i => ({ quantity:i.quantity, product:i.product }))
                };
                const embedJson = JSON.stringify(embed).replace(/<\/script>/gi,'<\\/script>');

                return `<!DOCTYPE html>

                tdata.push(['FINAL AMOUNT:',`₹${totals.finalAmount.toFixed(2)}`]); tdata.push(['TOTAL IN WORDS:',numberToWordsIndianSystem(totals.finalAmount)]);
