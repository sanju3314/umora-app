                                                        They will show as "Unknown" stock and you can still order any quantity for them. Usually it means the code is spelt differently in the two systems, or the item was never created in EasyEcom.
                                                    </div>
                                                    <div style={{ maxHeight:'150px', overflowY:'auto', fontSize:'12.5px', color:'#78350f', fontFamily:'monospace' }}>
                                                        {inventoryStats.unknownList.map((s,i)=>(<div key={i}>{s}</div>))}
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    )}
                                    <div style={{ marginTop:'26px', display:'flex', justifyContent:'space-between' }}>
                                        <button className="btn-secondary" onClick={()=>setCurrentStep(2)}>← Back</button>
                                        <button className="btn-primary" onClick={()=>setCurrentStep(4)} style={{ background:'linear-gradient(to right,#22c55e,#16a34a)' }}>Start Ordering →</button>
                                    </div>
                                </div>
                            )}

                            {/* Step 4 */}
                            {currentStep===4 && (
                                <div style={{ display:'flex', flexDirection:'column', gap:'20px' }}>
                                    <div className="card" style={{ padding:'24px' }}>
                                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'16px', flexWrap:'wrap', gap:'12px' }}>
                                            <h2 style={{ fontSize:'22px', fontWeight:700, margin:0 }}>{categories[currentCategory]} Products</h2>
                                            <span style={{ background:'#f3f4f6', padding:'5px 14px', borderRadius:'20px', fontSize:'13px' }}>Category {currentCategory+1} of {categories.length}</span>
                                        </div>
                                        <div style={{ display:'flex', gap:'8px', flexWrap:'wrap' }}>
                                            {categories.map((cat,i)=>(
                                                <button key={i} onClick={()=>setCurrentCategory(i)} style={{ padding:'8px 14px', borderRadius:'8px', border:'none', cursor:'pointer', fontWeight:600, background:currentCategory===i?'linear-gradient(to right,var(--brand1),var(--brand2))':'#f3f4f6', color:currentCategory===i?'#fff':'#374151' }}>{cat}</button>
                                            ))}
                                        </div>

                                        {/* ---- Fast-entry toolbar ---- */}
                                        <div style={{ marginTop:'18px', paddingTop:'16px', borderTop:'1px dashed #e5e7eb', display:'flex', gap:'10px', flexWrap:'wrap', alignItems:'center' }}>
                                            <input type="file" accept="image/*" multiple ref={shotInputRef} style={{ display:'none' }} onChange={handleScreenshotUpload} />
                                            <button className="btn-primary" style={{ background:'linear-gradient(to right,#0ea5e9,#0369a1)', padding:'10px 18px' }}
                                                onClick={()=>setShotOpen(true)}>📸 Order from Screenshots</button>

                                            <button className="btn-secondary" onClick={()=>{ setSelectMode(!selectMode); if(selectMode) clearSelection(); }}
                                                style={{ background:selectMode?'#4f46e5':'#e5e7eb', color:selectMode?'#fff':'#374151' }}>
                                                {selectMode?'☑ Selecting styles — tap to exit':'☑ Select Styles (bulk fill)'}
                                            </button>

                                            {selectMode && (<>
                                                <button className="btn-secondary" onClick={selectAllInCategory}>Select all in this category</button>
                                                <button className="btn-secondary" onClick={clearSelection}>Clear</button>
                                                <span style={{ fontWeight:700, color:'#4f46e5' }}>{selectedGroups.length} style(s) selected</span>
                                                <button className="btn-primary" disabled={!selectedGroups.length} onClick={openBulk}
                                                    style={{ background:selectedGroups.length?'linear-gradient(to right,#f97316,#ea580c)':'#9ca3af', padding:'10px 18px' }}>
                                                    ⚡ Enter Quantities →
                                                </button>
                                            </>)}
                                        </div>
                                    </div>
                                    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(480px,1fr))', gap:'18px' }}>
                                        {groupProductsByParentAndVariant(getCurrentCategoryProducts()).map((g,idx)=>{
                                          const gk = gKey(g); const isSel = selectedGroups.includes(gk);
                                          return (
                                            <div key={idx} className="card" style={{ padding:'18px', border:isSel?'2px solid #4f46e5':undefined, background:isSel?'#f5f4ff':undefined, cursor:selectMode?'pointer':'default' }} onClick={selectMode?()=>toggleGroup(gk):undefined}>
                                                <div style={{ display:'flex', gap:'14px' }}>
                                                    {selectMode && (
                                                        <input type="checkbox" checked={isSel} onChange={()=>toggleGroup(gk)} onClick={e=>e.stopPropagation()}
                                                            style={{ width:'22px', height:'22px', accentColor:'#4f46e5', cursor:'pointer', flexShrink:0, marginTop:'4px' }} />
                                                    )}
                                                    <img src={g.imageUrl||PLACEHOLDER} alt={g.parentSKU}
                                                        style={{ width:'92px', height:'115px', objectFit:'contain', background:'#fff', borderRadius:'8px', border:'1.5px solid #e5e7eb', cursor:'pointer', flexShrink:0 }}
                                                        onError={e=>imageFallback(e, g.imageUrl, g.imageUrl2)}
                                                        onClick={e=>{ e.stopPropagation(); openLightbox(e.target.src); }} />
                                                    <div style={{ flex:1 }}>
                                                        <h3 style={{ fontSize:'17px', fontWeight:700, margin:'0 0 4px', color:'var(--brand1)' }}>{g.parentSKU}</h3>
                                                        <p style={{ fontSize:'13px', color:'#6b7280', margin:'0 0 2px' }}>Color: {g.color} · Variant: {g.variant}</p>
                                                        <p style={{ fontSize:'13px', fontWeight:700, color:'#dc2626', margin:'0 0 8px' }}>MRP: ₹{g.mrp}</p>
                                                        {(g.discountType || g.remark1 || g.remark2) && (
                                                            <div style={{ display:'flex', gap:'6px', flexWrap:'wrap', marginBottom:'10px' }}>
                                                                {g.discountType && g.discountType.toLowerCase()!=='no discount' &&
                                                                    <span style={{ background:'#fef3c7', color:'#92400e', padding:'2px 8px', borderRadius:'999px', fontSize:'11px', fontWeight:700 }}>{g.discountType}</span>}
                                                                {g.remark1 && <span style={{ background:'#eef2ff', color:'#3730a3', padding:'2px 8px', borderRadius:'999px', fontSize:'11px', fontWeight:600 }}>{g.remark1}</span>}
                                                                {g.remark2 && <span style={{ background:'#eef2ff', color:'#3730a3', padding:'2px 8px', borderRadius:'999px', fontSize:'11px', fontWeight:600 }}>{g.remark2}</span>}
                                                            </div>
                                                        )}
                                                        {g.sizes.map((s,si)=>{ const q=orderData[s.childSKU]||0; const lt=q*parseFloat(s.wsp||0); const info=getStockInfo(s.childSKU);
                                                            return (
                                                                <div key={si} className={info.className} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'9px', borderRadius:'8px', marginBottom:'7px' }}>
                                                                    <div style={{ flex:1 }}>
                                                                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                                                            <span style={{ fontWeight:700 }}>{s.size}</span>
                                                                            <div style={{ display:'flex', gap:'8px' }}>
                                                                                {s.isOffer
                                                                                    ? <span style={{ background:'#fee2e2', color:'#991b1b', padding:'2px 8px', borderRadius:'4px', fontSize:'12px', fontWeight:700 }}>
                                                                                        Offer: ₹{s.wsp}{s.pack>1?` / pack of ${s.pack}`:''} <span style={{ textDecoration:'line-through', opacity:.65, fontWeight:500, marginLeft:'3px' }}>₹{Number(s.listWsp).toFixed(2)}</span>
                                                                                      </span>
                                                                                    : <span style={{ background:'#dcfce7', color:'#166534', padding:'2px 8px', borderRadius:'4px', fontSize:'12px' }}>WSP: ₹{s.wsp}{s.pack>1?` / pack of ${s.pack}`:''}</span>}
                                                                                <span style={{ fontWeight:700, fontSize:'12px' }}>{info.quantity===null?'Unknown':`Stock: ${info.quantity}`}</span>
                                                                            </div>
                                                                        </div>
                                                                        {q>0 && <div style={{ fontSize:'12px', color:'#2563eb', fontWeight:700, marginTop:'3px' }}>Total: ₹{lt.toFixed(2)}</div>}
                                                                    </div>
                                                                    <input type="number" min="0" max={info.quantity||9999} value={q===0?'':q} onClick={e=>e.stopPropagation()} onChange={e=>handleQuantityChange(s.childSKU,e.target.value)} style={{ width:'68px', padding:'5px', border:'1.5px solid #d1d5db', borderRadius:'6px', textAlign:'center', marginLeft:'10px' }} placeholder="0" />
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                          );
                                        })}
                                    </div>
                                    <div className="card" style={{ padding:'22px' }}>
                                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:'14px' }}>
                                            <div style={{ display:'flex', gap:'14px' }}>
                                                <div style={{ background:'linear-gradient(to right,#4f46e5,#4338ca)', padding:'12px 22px', borderRadius:'12px', color:'#fff', fontWeight:700 }}>📦 Total Qty: {totalItems}</div>
                                                <div style={{ background:'linear-gradient(to right,#22c55e,#15803d)', padding:'12px 22px', borderRadius:'12px', color:'#fff', fontWeight:700 }}>₹ {totalValue}</div>
                                            </div>
                                            <div style={{ display:'flex', gap:'12px' }}>
                                                <button className="btn-secondary" onClick={()=>setCurrentStep(editMode?5:3)}>← Back</button>
                                                <button className="btn-primary" onClick={proceedToInvoice} disabled={totalItems===0} style={{ background:totalItems>0?'linear-gradient(to right,#f97316,#ea580c)':'#9ca3af' }}>📄 {editMode?'Update':'Generate'} {docType} ({totalItems})</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Step 5 */}
                            {currentStep===5 && (
                                <div className="card" style={{ padding:'34px' }}>
                                    <h2 style={{ fontSize:'22px', fontWeight:700, marginTop:0, marginBottom:'24px' }}>🏢 {editMode?'Edit':'Generate'} {DOC_LABELS[docType]}</h2>
                                    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(380px,1fr))', gap:'28px' }}>
                                        <div>
                                            <h3 style={{ borderBottom:'2px solid #eef0f6', paddingBottom:'8px' }}>Customer Details</h3>
                                            <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
                                                <div><label style={{ fontWeight:600 }}>Customer Name *</label><input className="input-field" value={invoiceData.customerName} onChange={e=>setInvoiceData({...invoiceData,customerName:e.target.value})} /></div>
                                                <div><label style={{ fontWeight:600 }}>Address Line 1 *</label><input className="input-field" value={invoiceData.addressLine1} onChange={e=>setInvoiceData({...invoiceData,addressLine1:e.target.value})} placeholder="Street, building" /></div>
                                                <div><label style={{ fontWeight:600 }}>Address Line 2</label><input className="input-field" value={invoiceData.addressLine2} onChange={e=>setInvoiceData({...invoiceData,addressLine2:e.target.value})} placeholder="Area, landmark" /></div>
                                                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px' }}>
                                                    <div><label style={{ fontWeight:600 }}>City *</label><input className="input-field" value={invoiceData.city} onChange={e=>setInvoiceData({...invoiceData,city:e.target.value})} /></div>
                                                    <div><label style={{ fontWeight:600 }}>Pincode *</label><input className="input-field" value={invoiceData.pincode} onChange={e=>setInvoiceData({...invoiceData,pincode:e.target.value})} /></div>
                                                </div>
                                                <div><label style={{ fontWeight:600 }}>State *</label><select className="input-field" value={invoiceData.state} onChange={e=>setInvoiceData({...invoiceData,state:e.target.value})}><option value="">Select State</option>{indianStates.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
                                                <div><label style={{ fontWeight:600 }}>GST Number</label><input className="input-field" value={invoiceData.gstNo} onChange={e=>setInvoiceData({...invoiceData,gstNo:e.target.value.toUpperCase()})} placeholder="22AAAAA0000A1Z5" /></div>
                                                <div><label style={{ fontWeight:600 }}>Contact Person</label><input className="input-field" value={invoiceData.contactPerson} onChange={e=>setInvoiceData({...invoiceData,contactPerson:e.target.value})} /></div>
                                                <div><label style={{ fontWeight:600 }}>Contact Details</label><textarea className="input-field" value={invoiceData.contactDetails} onChange={e=>setInvoiceData({...invoiceData,contactDetails:e.target.value})} rows="2" /></div>
                                            </div>
                                        </div>
                                        <div>
                                            <h3 style={{ borderBottom:'2px solid #eef0f6', paddingBottom:'8px' }}>{DOC_LABELS[docType]} Details</h3>
                                            <div style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
                                                <div><label style={{ fontWeight:600 }}>{docType==='TI'?'Tax Invoice':'PI'} Number *</label><input className="input-field" value={invoiceData.piNumber} onChange={e=>setInvoiceData({...invoiceData,piNumber:e.target.value})} /></div>
                                                {docType==='TI' && (
                                                    <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px' }}>
                                                        <div><label style={{ fontWeight:600 }}>Against PI Number</label><input className="input-field" value={invoiceData.againstPI||''} onChange={e=>setInvoiceData({...invoiceData,againstPI:e.target.value})} placeholder="e.g. 45/2026-27" /></div>
                                                        <div><label style={{ fontWeight:600 }}>PI Date</label><input type="date" className="input-field" value={invoiceData.againstPIDate||''} onChange={e=>setInvoiceData({...invoiceData,againstPIDate:e.target.value})} /></div>
                                                    </div>
                                                )}
                                                <div><label style={{ fontWeight:600 }}>{DOC_LABELS[docType]} Date</label><input type="date" className="input-field" value={customerData.date} onChange={e=>setCustomerData({...customerData,date:e.target.value})} /></div>
                                                <div><label style={{ fontWeight:600 }}>Total Cartons/Boxes</label><input className="input-field" value={invoiceData.totalCartons} onChange={e=>setInvoiceData({...invoiceData,totalCartons:e.target.value})} /></div>
                                                <div><label style={{ fontWeight:600 }}>E-way Bill Number</label><input className="input-field" value={invoiceData.ewayBillNumber} onChange={e=>setInvoiceData({...invoiceData,ewayBillNumber:e.target.value})} /></div>
                                                <div><label style={{ fontWeight:600 }}>Payment Terms</label>
                                                    <select className="input-field" value={invoiceData.paymentTerms} onChange={e=>setInvoiceData({...invoiceData,paymentTerms:e.target.value})}><option value="100% ADVANCE">100% ADVANCE</option><option value="OTHER">Other</option></select>
                                                    {invoiceData.paymentTerms==='OTHER' && <input className="input-field" style={{ marginTop:'8px' }} value={invoiceData.customPaymentTerms} onChange={e=>setInvoiceData({...invoiceData,customPaymentTerms:e.target.value})} placeholder="Custom payment terms" />}
                                                </div>
                                                <div><label style={{ fontWeight:600 }}>Logistics Charges (₹)</label><input type="number" min="0" step="0.01" className="input-field" value={invoiceData.logisticsCharges} onChange={e=>setInvoiceData({...invoiceData,logisticsCharges:parseFloat(e.target.value)||0})} /></div>
                                                {(()=>{ const t=calculateInvoiceTotals(); return (
                                                <div style={{ background:'#fef2f2', border:'1.5px solid #fca5a5', borderRadius:'10px', padding:'12px' }}>
                                                    <label style={{ fontWeight:700 }}>Volume Discount</label>
                                                    <select className="input-field" style={{ marginTop:'6px' }} value={String(invoiceData.volumeDiscount===undefined?'auto':invoiceData.volumeDiscount)} onChange={e=>setInvoiceData({...invoiceData,volumeDiscount:e.target.value})}>
                                                        <option value="auto">Auto by slab — {t.autoPct}% for this order</option>
                                                        {['0','3','5','7','10'].map(v=><option key={v} value={v}>{v}%</option>)}
                                                    </select>
                                                    <div style={{ fontSize:'12.5px', color:'#7f1d1d', marginTop:'6px' }}>
                                                        {t.totalPieces} pcs · ₹{t.totalValue.toFixed(0)} before discount. Slab: 100+ pcs 3% (5% above ₹40,000), 200+ pcs 7%, 500+ pcs 10%. No piece goes below ₹{VOL_FLOOR}.<br/>
                                                        <strong>Free gifts due: {t.gifts}</strong> — add them to the order as ₹0 lines or pack them separately.
                                                    </div>
                                                </div> ); })()}
                                                <div><label style={{ fontWeight:600 }}>Cash Discount (%)</label><input type="number" min="0" max="100" step="0.1" className="input-field" value={invoiceData.cashDiscount} onChange={e=>setInvoiceData({...invoiceData,cashDiscount:parseFloat(e.target.value)||0})} /></div>
                                                <div style={{ background:'#f9fafb', padding:'18px', borderRadius:'10px', border:'1px solid #eef0f6' }}>
                                                    <h4 style={{ fontWeight:700, margin:'0 0 12px' }}>Invoice Preview</h4>
                                                    {(()=>{ const t=calculateInvoiceTotals(); return (
                                                        <div style={{ display:'flex', flexDirection:'column', gap:'6px', fontSize:'14px' }}>
                                                            <div style={{ display:'flex', justifyContent:'space-between' }}><span>Total Qty:</span><strong>{t.totalQty}</strong></div>
                                                            <div style={{ display:'flex', justifyContent:'space-between' }}><span>Total Value:</span><strong>₹{t.totalValue.toFixed(2)}</strong></div>
                                                            {t.volAmount>0 && <div style={{ display:'flex', justifyContent:'space-between', color:'#dc2626' }}><span>Volume discount ({t.volPct}%):</span><strong>-₹{t.volAmount.toFixed(2)}</strong></div>}
                                                            {invoiceData.cashDiscount>0 && <div style={{ display:'flex', justifyContent:'space-between', color:'#dc2626' }}><span>Discount ({invoiceData.cashDiscount}%):</span><strong>-₹{t.discountAmount.toFixed(2)}</strong></div>}
                                                            {invoiceData.logisticsCharges>0 && <div style={{ display:'flex', justifyContent:'space-between', color:'#2563eb' }}><span>Logistics:</span><strong>+₹{parseFloat(invoiceData.logisticsCharges).toFixed(2)}</strong></div>}
                                                            <div style={{ display:'flex', justifyContent:'space-between', borderTop:'1px solid #d1d5db', paddingTop:'6px' }}><span>Net Amount:</span><strong>₹{t.netAmount.toFixed(2)}</strong></div>
                                                            {t.isMaharashtra ? (<><div style={{ display:'flex', justifyContent:'space-between', color:'#16a34a' }}><span>CGST @ 2.5%:</span><strong>₹{t.cgst.toFixed(2)}</strong></div><div style={{ display:'flex', justifyContent:'space-between', color:'#16a34a' }}><span>SGST @ 2.5%:</span><strong>₹{t.sgst.toFixed(2)}</strong></div></>) : (<div style={{ display:'flex', justifyContent:'space-between', color:'#16a34a' }}><span>IGST @ 5%:</span><strong>₹{t.igst.toFixed(2)}</strong></div>)}
                                                            <div style={{ display:'flex', justifyContent:'space-between', borderTop:'2px solid #374151', paddingTop:'6px', fontSize:'16px', fontWeight:800 }}><span>Final:</span><span style={{ color:'#16a34a' }}>₹{t.finalAmount.toFixed(2)}</span></div>
                                                            <div style={{ marginTop:'8px', padding:'10px', background:'#f0fdf4', border:'1.5px solid #86efac', borderRadius:'8px' }}>
                                                                <div style={{ display:'flex', justifyContent:'space-between', fontWeight:700, color:'#14532d' }}><span>MRP value of order:</span><span>₹{t.mrpValue.toFixed(2)}</span></div>
                                                                {t.savingsTotal>0 && <div style={{ display:'flex', justifyContent:'space-between', fontWeight:800, color:'#15803d', marginTop:'4px' }}><span>Buyer saved:</span><span>₹{t.savingsTotal.toFixed(2)}</span></div>}
                                                            </div>
                                                        </div>
                                                    ); })()}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div style={{ marginTop:'32px', display:'flex', justifyContent:'space-between' }}>
                                        <button className="btn-secondary" onClick={()=>setCurrentStep(4)}>← Back to Orders</button>
                                        <button className="btn-primary" onClick={()=>setShowDownloadOptions(true)} disabled={!invoiceData.customerName||!invoiceData.addressLine1||!invoiceData.city||!invoiceData.pincode||!invoiceData.state} style={{ background:(invoiceData.customerName&&invoiceData.addressLine1&&invoiceData.city&&invoiceData.pincode&&invoiceData.state)?'linear-gradient(to right,#16a34a,#15803d)':'#9ca3af' }}>📄 Download {docType}</button>
                                    </div>

                                    {showDownloadOptions && (
                                        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.5)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1000 }}>
                                            <div style={{ background:'#fff', borderRadius:'14px', padding:'34px', maxWidth:'460px', width:'90%' }}>
                                                <h3 style={{ textAlign:'center', marginTop:0 }}>📄 Download {DOC_LABELS[docType]}</h3>
                                                <div style={{ display:'flex', flexDirection:'column', gap:'12px', marginTop:'20px' }}>
                                                    <button className="btn-primary" onClick={downloadAsPDF} style={{ background:'linear-gradient(to right,#dc2626,#b91c1c)' }}>📄 Download as PDF (Print)</button>
                                                    <button className="btn-primary" onClick={downloadAsHTML} style={{ background:'linear-gradient(to right,#2563eb,#1d4ed8)' }}>🌐 Download as HTML (re-editable)</button>
                                                    <button className="btn-primary" onClick={downloadAsExcel} style={{ background:'linear-gradient(to right,#16a34a,#15803d)' }}>📊 Download as Excel</button>
                                                </div>
                                                <div style={{ marginTop:'16px', padding:'12px', background:'#eff6ff', borderRadius:'8px', fontSize:'13px', color:'#1e40af' }}>
                                                    💡 The <strong>HTML</strong> file stores all invoice data — re-upload it on the start screen to edit later.
                                                </div>
                                                <div style={{ marginTop:'16px', textAlign:'center' }}><button className="btn-secondary" onClick={()=>setShowDownloadOptions(false)}>Cancel</button></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* ================= BULK QUANTITY MODAL ================= */}
                    {bulkOpen && (
                        <div style={{ position:'fixed', inset:0, background:'rgba(15,23,42,.55)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1200, padding:'16px' }}>
                            <div className="card" style={{ padding:'28px', width:'100%', maxWidth:'560px', maxHeight:'88vh', overflowY:'auto' }}>
                                <h3 style={{ marginTop:0, fontSize:'20px' }}>⚡ Fill quantities for {selectedGroups.length} selected style(s)</h3>
                                <p style={{ color:'#6b7280', fontSize:'13px', marginTop:0 }}>
                                    Type a quantity next to a size and it goes into <strong>every</strong> selected style that has that size.
                                    Leave a size blank to leave it untouched.
                                </p>

                                <div style={{ background:'#eef2ff', borderRadius:'10px', padding:'16px', margin:'18px 0' }}>
                                    <label style={{ fontWeight:700, fontSize:'14px' }}>Same quantity in every size</label>
                                    <div style={{ display:'flex', gap:'10px', marginTop:'8px' }}>
                                        <input type="number" min="0" className="input-field" style={{ flex:1 }} value={bulkAll}
                                            onChange={e=>setBulkAll(e.target.value)} placeholder="e.g. 1" />
                                        <button className="btn-primary" style={{ whiteSpace:'nowrap' }} onClick={()=>applyBulkAllSizes(bulkAll)}>Fill all sizes</button>
                                    </div>
                                </div>

                                <div style={{ display:'flex', gap:'18px', flexWrap:'wrap', marginBottom:'14px', fontSize:'14px' }}>
                                    <label style={{ display:'flex', gap:'6px', alignItems:'center', fontWeight:600 }}>
                                        <input type="radio" checked={bulkMode==='set'} onChange={()=>setBulkMode('set')} /> Set exact quantity
                                    </label>
                                    <label style={{ display:'flex', gap:'6px', alignItems:'center', fontWeight:600 }}>
                                        <input type="radio" checked={bulkMode==='add'} onChange={()=>setBulkMode('add')} /> Add to what's already there
                                    </label>
                                    <label style={{ display:'flex', gap:'6px', alignItems:'center', fontWeight:600 }}>
                                        <input type="checkbox" checked={bulkCap} onChange={e=>setBulkCap(e.target.checked)} /> Never exceed available stock
                                    </label>
                                </div>

                                <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))', gap:'10px' }}>
                                    {Object.keys(bulkQty).sort((a,b)=>sizeRank(a)-sizeRank(b)).map(sz=>(
                                        <div key={sz} style={{ display:'flex', alignItems:'center', gap:'8px', background:'#f9fafb', border:'1px solid #eef0f6', borderRadius:'8px', padding:'8px 10px' }}>
                                            <span style={{ fontWeight:700, flex:1, fontSize:'14px' }}>{sz}</span>
                                            <input type="number" min="0" value={bulkQty[sz]} onChange={e=>setBulkQty({...bulkQty, [sz]:e.target.value})}
                                                style={{ width:'62px', padding:'6px', border:'1.5px solid #d1d5db', borderRadius:'6px', textAlign:'center' }} placeholder="—" />
                                        </div>
                                    ))}
                                </div>

                                <div style={{ marginTop:'24px', display:'flex', justifyContent:'space-between', gap:'12px' }}>
                                    <button className="btn-secondary" onClick={()=>setBulkOpen(false)}>Cancel</button>
                                    <button className="btn-primary" style={{ background:'linear-gradient(to right,#f97316,#ea580c)' }} onClick={executeBulk}>⚡ Execute</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ================= ORDER SCREENSHOTS MODAL ================= */}
                    {shotOpen && (
                        <div style={{ position:'fixed', inset:0, background:'rgba(15,23,42,.55)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:1200, padding:'16px' }}>
                            <div className="card" style={{ padding:'28px', width:'100%', maxWidth:'900px', maxHeight:'90vh', overflowY:'auto' }}>
                                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:'12px' }}>
                                    <div>
                                        <h3 style={{ marginTop:0, marginBottom:'4px', fontSize:'20px' }}>📸 Order from WhatsApp Screenshots</h3>
                                        <p style={{ color:'#6b7280', fontSize:'13px', margin:0 }}>Upload the catalogue screenshots the buyer sent back. Styles they ticked in green are picked up automatically — check the list before adding.</p>
                                    </div>
                                    <button className="btn-secondary" onClick={()=>setShotOpen(false)}>✕</button>
                                </div>

                                <div style={{ border:'2px dashed #0ea5e9', borderRadius:'12px', padding:'26px', textAlign:'center', background:'#f0f9ff', margin:'18px 0' }}>
                                    <div style={{ fontSize:'34px' }}>🖼️</div>
                                    <p style={{ color:'#0369a1', fontWeight:600, margin:'8px 0 14px' }}>
                                        {shotRows.length? `${shotRows.length} ticked style(s) found so far` : 'Select all the buyer\'s screenshots at once (JPG / PNG)'}
                                    </p>
                                    <div style={{ display:'flex', gap:'10px', justifyContent:'center', flexWrap:'wrap' }}>
                                        <button className="btn-primary" style={{ background:'linear-gradient(to right,#0ea5e9,#0369a1)' }} disabled={!!shotBusy}
                                            onClick={()=>shotInputRef.current?.click()}>🖼️ {shotRows.length?'Add More Screenshots':'Choose Screenshots'}</button>
                                        {(shotRows.length>0||shotMisses.length>0) && <button className="btn-secondary" disabled={!!shotBusy} onClick={resetShots}>Clear results</button>}
                                    </div>
                                    {shotBusy && (
                                        <div style={{ marginTop:'18px' }}>
                                            <div style={{ fontWeight:700, color:'#0369a1', marginBottom:'8px' }}>{shotBusy.label} — {shotBusy.done} of {shotBusy.total} done</div>
                                            <div style={{ height:'10px', background:'#dbeafe', borderRadius:'6px', overflow:'hidden' }}>
                                                <div style={{ height:'100%', width:`${Math.round((shotBusy.done/shotBusy.total)*100)}%`, background:'linear-gradient(to right,#0ea5e9,#0369a1)', transition:'.3s' }} />
                                            </div>
                                            <div style={{ fontSize:'12px', color:'#6b7280', marginTop:'8px' }}>Reading text from images takes a few seconds each — please keep this window open.</div>
                                        </div>
                                    )}
                                </div>

                                {shotRows.length>0 && (
                                    <>
                                        <div style={{ display:'flex', gap:'10px', flexWrap:'wrap', alignItems:'center', background:'#f9fafb', border:'1px solid #eef0f6', borderRadius:'10px', padding:'12px', marginBottom:'14px' }}>
                                            <span style={{ fontWeight:700, fontSize:'14px' }}>Quantity per size:</span>
                                            <input type="number" min="0" value={shotDefaultQty} onChange={e=>shotApplyQtyAll(e.target.value)}
                                                style={{ width:'70px', padding:'6px', border:'1.5px solid #d1d5db', borderRadius:'6px', textAlign:'center' }} />
                                            <button className="btn-secondary" onClick={shotAllSizes}>Use every size</button>
                                            <button className="btn-secondary" onClick={shotInStock}>Only sizes in stock</button>
                                            <span style={{ fontSize:'12px', color:'#6b7280' }}>Tap a size to switch it on or off. The number after each size is the stock you have.</span>
                                        </div>

                                        <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                                            {shotRows.map(r=>(
                                                <div key={r.key} style={{ display:'flex', gap:'12px', alignItems:'flex-start', border:'1px solid #eef0f6', borderRadius:'10px', padding:'12px', background:r.include?'#fff':'#f3f4f6', opacity:r.include?1:.55 }}>
                                                    <input type="checkbox" checked={r.include} onChange={()=>shotToggleInclude(r.key)} style={{ width:'20px', height:'20px', accentColor:'#4f46e5', marginTop:'4px' }} />
                                                    <img src={(r.group&&r.group.imageUrl)||r.thumb} alt={r.parent} style={{ width:'54px', height:'68px', objectFit:'contain', background:'#fff', borderRadius:'8px', border:'1px solid #e5e7eb', flexShrink:0 }}
                                                        onError={e=>imageFallback(e, r.group&&r.group.imageUrl, r.group&&r.group.imageUrl2, r.thumb)} />
                                                    <div style={{ flex:1, minWidth:0 }}>
                                                        <div style={{ fontWeight:700, color:'var(--brand1)' }}>{r.parent} <span style={{ color:'#6b7280', fontWeight:500, fontSize:'13px' }}>{r.group?`· ${r.color} (${r.variant})`:''}</span></div>
                                                        {!r.group && (
                                                            <div style={{ marginTop:'7px', background:'#fffbeb', border:'1px solid #fde68a', borderRadius:'8px', padding:'8px 10px' }}>
                                                                <div style={{ fontSize:'12.5px', color:'#92400e', fontWeight:600, marginBottom:'6px' }}>
                                                                    Couldn't read the colour{r.ocrColor?` (it looked like "${r.ocrColor}")`:''} — please pick it:
                                                                </div>
                                                                <select className="input-field" style={{ padding:'7px' }} defaultValue="" onChange={e=>shotResolve(r.key, e.target.value)}>
                                                                    <option value="">Choose colour…</option>
                                                                    {r.options.map(o=><option key={o.variant} value={o.variant}>{o.color} ({o.variant})</option>)}
                                                                </select>
                                                            </div>
                                                        )}
                                                        <div style={{ display:'flex', gap:'6px', flexWrap:'wrap', marginTop:'7px' }}>
                                                            {r.catSizes.map(s=>{
                                                                const on = r.sizes.includes(s.norm);
                                                                const out = s.stock!==null && s.stock<=0;
                                                                return (
                                                                    <button key={s.norm} onClick={()=>shotToggleSize(r.key,s.norm)} title={s.stock===null?'stock unknown':`stock ${s.stock}`}
                                                                        style={{ border:'1.5px solid '+(on?'#4f46e5':'#d1d5db'), background:on?'#4f46e5':'#fff', color:on?'#fff':(out?'#9ca3af':'#374151'),
                                                                                 borderRadius:'999px', padding:'4px 11px', fontSize:'12.5px', fontWeight:700, cursor:'pointer' }}>
                                                                        {s.size}{s.stock!==null?` · ${s.stock}`:''}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                        <div style={{ fontSize:'11.5px', color:'#9ca3af', marginTop:'6px' }}>from {r.file}</div>
                                                    </div>
                                                    <div style={{ textAlign:'right', flexShrink:0 }}>
                                                        <div style={{ fontSize:'11px', color:'#6b7280', fontWeight:600 }}>Qty/size</div>
                                                        <input type="number" min="0" value={r.qty} onChange={e=>shotSetQty(r.key,e.target.value)}
                                                            style={{ width:'62px', padding:'6px', border:'1.5px solid #d1d5db', borderRadius:'6px', textAlign:'center', marginTop:'3px' }} />
                                                        <div><button onClick={()=>shotRemove(r.key)} style={{ border:'none', background:'none', color:'#dc2626', fontSize:'12px', cursor:'pointer', marginTop:'6px', fontWeight:600 }}>Remove</button></div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}

                                {shotMisses.length>0 && (
                                    <div style={{ marginTop:'16px', background:'#fffbeb', border:'1px solid #fde68a', borderRadius:'10px', padding:'14px' }}>
                                        <div style={{ fontWeight:700, color:'#92400e', marginBottom:'6px' }}>⚠️ Needs a manual look ({shotMisses.length})</div>
                                        <ul style={{ margin:0, paddingLeft:'20px', color:'#92400e', fontSize:'13px' }}>
                                            {shotMisses.map((m,i)=>(<li key={i}>{m.note? `${m.file} — ${m.note}` : `${m.parent} ${m.color||m.variant||''} — not found in the catalog (${m.file})`}</li>))}
                                        </ul>
                                    </div>
                                )}

                                <div style={{ marginTop:'24px', display:'flex', justifyContent:'space-between', gap:'12px', flexWrap:'wrap' }}>
                                    <button className="btn-secondary" onClick={()=>setShotOpen(false)}>Close</button>
                                    <button className="btn-primary" disabled={!shotRows.some(r=>r.include&&r.group)||!!shotBusy}
                                        style={{ background:(shotRows.some(r=>r.include&&r.group)&&!shotBusy)?'linear-gradient(to right,#16a34a,#15803d)':'#9ca3af' }}
                                        onClick={applyScreenshotRows}>
                                        ✅ Add {shotRows.filter(r=>r.include&&r.group).reduce((n,r)=>n+r.sizes.length,0)} line(s) to the order
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className={`lightbox-overlay ${lightbox.visible?'visible':''}`} onClick={closeLightbox}>
                        <div className="lightbox-content" onClick={e=>e.stopPropagation()}>
                            <button className="lightbox-close" onClick={closeLightbox}>×</button>
                            <img src={lightbox.imageUrl} alt="Product" className="lightbox-image" onError={e=>e.target.src='https://placehold.co/800x600/CCCCCC/333333?text=Image+Load+Error'} />
                        </div>
                    </div>
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
